name: Search restaurant candidates

on:
  push:
    branches: [DEV]
    paths-ignore:
      - candidate-results/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Search Google Places candidates
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ADD_RESTAURANT_CANDIDATES_PATH: ${{ runner.temp }}/candidates.json
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 .claude/skills/add-restaurant/scripts/search_candidates.py

      - name: Upload candidate list
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-candidates-${{ github.run_number }}
          path: ${{ runner.temp }}/candidates.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish candidate list to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate-results
          cp "${{ runner.temp }}/candidates.json" candidate-results/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish restaurant search candidates"
          git push
