name: Search Seomyeon shopping/attraction/baby-store candidates

on:
  push:
    branches: [DEV]
    paths:
      - scripts/busan-trip/search_seomyeon_shopping.py
      - scripts/busan-trip/fetch_details_seomyeon_shopping.py
      - .github/workflows/search-seomyeon-shopping.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Search 逛街/景點/母嬰用品 candidates near 西面
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 scripts/busan-trip/search_seomyeon_shopping.py

      - name: Publish candidate results to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/seomyeon-shopping-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Seomyeon shopping/attraction/baby-store candidates"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest DEV and retrying ($i)"
            git fetch origin DEV
            git rebase origin/DEV
          done
          exit 1
