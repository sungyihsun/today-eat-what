name: Search Taiwan clothing candidates

on:
  push:
    branches: [DEV]
    paths:
      - scripts/taiwan-clothing/search_clothing_categories.py
      - scripts/taiwan-clothing/fetch_details_clothing.py
      - .github/workflows/search-taiwan-clothing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Search Google Places candidates per category
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 scripts/taiwan-clothing/search_clothing_categories.py

      - name: Select final candidates (manually curated after 2 automatic rounds) and fetch details
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          # Round 2's automatic filter (KEYWORDS/TYPE_HINT/EXCLUDE_*) got
          # every category to 12/12/12/12 except 選品店 (5), but manual
          # review of round 2's own final-list.json still found leftovers:
          # a men's-underwear/adult-novelty "warehouse, online-only" listing
          # in 男裝, a shoe-cleaning service and a shoe-repair shop (not
          # retail) in 鞋包配件, and two 平價服飾 picks with zero budget
          # signal that were only there because "服飾" alone is too generic
          # a keyword. 選品店 needed digging through the full 210-candidate
          # pool (most of which was irrelevant 室內設計/interior-design
          # firms and toy/pet/home-goods stores that happened to contain
          # "選物"/"選品") to find genuine curated-clothing-boutique matches.
          # This step is hand-picked from candidate-results/tw-clothing-candidates.json
          # (committed by this workflow's previous runs) instead of another
          # automatic pass, since every name below has been individually
          # checked against its Google types/address.
          selected = {
            "男裝": [
              "MKone 男裝", "3lines男裝中性服飾", "Laio 萊歐復古紳士裝 - 新竹店",
              "CMF 韓國男裝服飾", "dnews男裝服飾", "GA.Design - 客製西服",
              "Mr.Black 黑仕訂製西服", "EMTM型男西服",
              "EZ西服-桃園形象概念館 - ElegaZzle Bespoke Suit", "Dandy西服竹北店",
              "男裝社西服號", "BeMAX胖胖星球-男裝大尺碼服飾(桃園旗艦店)",
            ],
            "女裝": [
              "Gold韓國女裝服飾店", "GM日韓女裝",
              "QkM.21微/正式西裝 • 學生面試套裝 • 情侶穿搭・女生西裝 • 大尺碼 • 休閒西裝 • 情侶西裝",
              "UnASeouL 韓國精品女裝", "荷莉漾", "iROO桃園藝文店", "iROO桃園店",
              "HAI the label 新竹大遠百專櫃", "YamiYa", "LLstudio", "MOMA桃園門市",
              "Sen服飾桃園中正店",
            ],
            "鞋包配件": [
              "BONJOUR 女鞋 試鞋空間 桃園站前店", "BK先生教你選對鞋 - 桃園建國門市",
              "ROYAL SELECT 新竹皇家流行概念館", "千步專業鞋墊-桃園門市",
              "小腳慢步童鞋 桃園店", "千步專業鞋墊 萬家福經國店",
              "牧田工作安全鞋專賣店-竹北自強門市", "走四方訂製鞋墊 竹北店-新竹竹北客製訂製/兒童/大人鞋墊 扁平足/矯正鞋墊/足弓墊/足底筋膜炎 專業價格推薦 PTT Dcard",
              "模靚(手作飾品)", "碧瑄飾品屋",
              "Ann'S 新竹門市 - 小白鞋 高跟鞋 涼鞋 婚鞋 尖頭鞋 平底鞋 牛津鞋 休閒鞋 懶人鞋 靴子 短靴 襪靴 過膝靴 膝上靴 雪靴 包包 大尺碼女鞋專賣",
              "布布童鞋-竹北自強門市",
            ],
            "平價服飾": [
              "Office Star職業男女服飾新竹店-平價西裝/職場套裝/團體制服/禮服西服",
              "OOTD我的穿搭服飾精品店", "P8精品服飾-新竹市-服飾店-日本服飾",
              "Bruno韓國服飾店（2樓）", "JSMIX大尺碼服飾-桃園站前門市", "Eshow流行服飾",
              "山頂鳥Hilltop 特賣會", "RP 暢貨中心 Outlet", "FILA Outlet 華泰名品城",
              "力莉服飾店", "Levi's 華泰名品城Outlet", "CondorStore OUTLET - HSINCHU",
            ],
            "選品店": [
              "Twenty Boutique 新竹店", "LYLO 來囉！服飾選品店",
              "竹北 Goofing-off 日系服飾選品店", "POLARbear(大白熊) 中性服飾選貨店",
              "Definite.Select 潮流選貨店", "BLACKOUT", "Hydra Garment N'sneaker",
              "MO-BO 竹北體驗概念店", "蘋古AFA VINTAGE 古著", "ZOEY 走你文化國際精品",
            ],
          }
          json.dump(selected, open("candidate-results/tw-clothing-final-list.json", "w"), ensure_ascii=False, indent=2)
          for cat, names in selected.items():
              print(cat, len(names))
          PY
          python3 scripts/taiwan-clothing/fetch_details_clothing.py

      - name: Publish candidate results to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/tw-clothing-candidates.json candidate-results/tw-clothing-final-list.json candidate-results/tw-clothing-details.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Taiwan clothing candidates"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest DEV and retrying ($i)"
            git fetch origin DEV
            git rebase origin/DEV
          done
          exit 1
