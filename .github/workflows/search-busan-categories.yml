name: Search Busan category-expansion candidates

on:
  push:
    branches: [DEV]
    paths:
      - scripts/busan-trip/search_busan_categories.py
      - scripts/busan-trip/fetch_details_busan_categories.py
      - .github/workflows/search-busan-categories.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Search Google Places candidates per category
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 scripts/busan-trip/search_busan_categories.py

      - name: Select top candidates per category and fetch details
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, re
          candidates = json.load(open("candidate-results/busan-cat-candidates.json"))
          html = open("index.html", encoding="utf-8").read()
          existing_cids = set(re.findall(r"cid=(\d+)", html))
          existing_names = set(re.findall(r'\{name:"((?:[^"\\]|\\.)*)"', html))
          # how many NEW places each category still needs.
          # 燒烤/石鍋拌飯/人蔘雞湯/辣炒年糕/海鮮/咖啡廳 already done
          # (12/6/12/12/12/13). 服飾 already has 12 — this run adds 22 more
          # BUDGET-focused ones (target 30+ total), buffer above 30 since
          # the priceLevel filter below will drop some candidates.
          TARGET_NEW = {"服飾": 22}
          # A broad textQuery like "부산 고기집 맛집" returns plenty of highly
          # rated restaurants near the hub that don't actually serve the
          # target dish (Google has no place-type granular enough for this).
          # Require the name or type to actually signal the dish before a
          # candidate is eligible, instead of trusting rating alone.
          KEYWORDS = {
              "燒烤": ["갈비","구이","고기","삼겹","오겹","로스","불고기","barbecue","bbq","烤"],
              "石鍋拌飯": ["비빔밥","拌飯","bibim"],
              "人蔘雞湯": ["삼계탕","蔘鷄湯","参鶏湯","samgyetang","백숙"],
              "辣炒年糕": ["떡볶이","분식","年糕","tteokbokki","ttokbokki","bunsik"],
              "海鮮": ["회","조개","해물","해산물","낙지","문어","쭈꾸미","sashimi","seafood","대게","전복","물회","水產","水产","생선"],
              "咖啡廳": ["카페","커피","cafe","coffee","브런치","焙煎","로스터리","roastery"],
              "服飾": ["옷가게","의류","패션","보세","편집샵","셀렉샵","스토어","clothing","fashion","apparel","boutique"],
          }
          TYPE_HINT = {
              "燒烤": ["barbecue_restaurant","korean_barbecue_restaurant"],
              "海鮮": ["seafood_restaurant"],
              "辣炒年糕": ["snack_bar"],
              "咖啡廳": ["cafe","coffee_shop"],
              "服飾": ["clothing_store","shoe_store","boutique"],
          }
          by_cat = {}
          for key, place in candidates.items():
              by_cat.setdefault(place["cat_label"], []).append(place)
          selected = {}
          for cat_label, target in TARGET_NEW.items():
              rows = by_cat.get(cat_label, [])
              rows = [r for r in rows if r["cid"] not in existing_cids and r["name"] not in existing_names]
              kws = KEYWORDS[cat_label]
              types_hint = TYPE_HINT.get(cat_label, [])
              def is_relevant(r):
                  name_l = r["name"].lower()
                  types = r.get("types") or []
                  return any(k.lower() in name_l for k in kws) or any(t in types for t in types_hint)
              rows = [r for r in rows if is_relevant(r)]
              if cat_label == "服飾":
                  # Budget-only pass: keep INEXPENSIVE/MODERATE or missing
                  # priceLevel (lots of small boutiques never set it —
                  # dropping those would throw out genuinely cheap places),
                  # exclude anything explicitly marked EXPENSIVE+.
                  EXPENSIVE = {"PRICE_LEVEL_EXPENSIVE", "PRICE_LEVEL_VERY_EXPENSIVE"}
                  rows = [r for r in rows if r.get("priceLevel") not in EXPENSIVE]
              ranked = sorted(rows, key=lambda p: (p["rating"], p["userRatingCount"]), reverse=True)
              picked = ranked[:target]
              selected[cat_label] = [p["name"] for p in picked]
              print(cat_label, "picked", len(picked), "of target", target, "(", len(rows), "topically relevant candidates available )")
          # The keyword/type filter above only recognizes single-brand
          # clothing_store places — it can't tell that Busan's famous
          # underground shopping arcades (지하상가) and traditional/wholesale
          # markets are themselves dense clusters of budget clothing stalls
          # (the itinerary explicitly calls out 西面地下街 for shopping).
          # These are hand-picked from this run's raw candidate pool by name
          # after manually reviewing it — real department stores/outlets
          # that skew premium were deliberately left out to keep this list
          # 平價-only, except the outlet mall (outlets are discount by
          # definition).
          MARKET_PICKS_SERVICES = [
              "西面地下街", "光復地下商街", "南浦地下商街", "國際市場",
              "부전몰 - 서면지하도상가", "光復路時尚街", "釜山鎭市場",
              "Lotte Premium Outlets 東釜山店",
          ]
          by_name_all = {p["name"]: p for p in candidates.values()}
          if "服飾" in selected:
              already = set(selected["服飾"])
              extra = [n for n in MARKET_PICKS_SERVICES if n in by_name_all and n not in already]
              selected["服飾"] = selected["服飾"] + extra
              print("服飾 + market/arcade picks:", extra, "(missing from candidates:", [n for n in MARKET_PICKS_SERVICES if n not in by_name_all], ")")
          json.dump(selected, open("candidate-results/busan-cat-final-list.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(selected, ensure_ascii=False, indent=2))
          PY
          python3 scripts/busan-trip/fetch_details_busan_categories.py

      - name: Publish candidate results to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/busan-cat-candidates.json candidate-results/busan-cat-final-list.json candidate-results/busan-cat-details.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Busan category-expansion candidates"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest DEV and retrying ($i)"
            git fetch origin DEV
            git rebase origin/DEV
          done
          exit 1
