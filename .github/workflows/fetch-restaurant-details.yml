name: Fetch restaurant details

# Trigger: commit candidate-results/picks.json to DEV.
#   {"area": "南屯", "candidates_file": "candidate-results/search-nantun.json",
#    "picks": ["exact Google name", ...]}
# Resolves the picks against the FROZEN candidates file (never re-searches —
# Text Search results vary between calls, which once dropped 6 of 30 picks),
# fetches Place Details, fails unless every pick resolved, and publishes
# candidate-results/details.json + final-list.json to DEV.
on:
  push:
    branches: [DEV]
    paths:
      - candidate-results/picks.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Fetch details for the picks
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ADD_RESTAURANT_FINAL_LIST_PATH: ${{ runner.temp }}/final_list.json
          ADD_RESTAURANT_DETAILS_PATH: ${{ runner.temp }}/details.json
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 - <<'PY'
          import json, os
          p = json.load(open("candidate-results/picks.json", encoding="utf-8"))
          json.dump({p["area"]: p["picks"]}, open(os.environ["ADD_RESTAURANT_FINAL_LIST_PATH"], "w"), ensure_ascii=False, indent=2)
          PY
          export ADD_RESTAURANT_CANDIDATES_PATH="$(python3 -c 'import json;print(json.load(open("candidate-results/picks.json", encoding="utf-8"))["candidates_file"])')"
          echo "candidates file: $ADD_RESTAURANT_CANDIDATES_PATH"
          python3 .claude/skills/add-restaurant/scripts/fetch_details.py
          python3 - <<'PY'
          import json, os
          want = sum(len(v) for v in json.load(open(os.environ["ADD_RESTAURANT_FINAL_LIST_PATH"], encoding="utf-8")).values())
          got = len(json.load(open(os.environ["ADD_RESTAURANT_DETAILS_PATH"], encoding="utf-8")))
          assert got == want, f"only {got} of {want} picks resolved — see the 'missing:' line above"
          print(f"all {got} picks resolved")
          PY

      - name: Publish details to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "${{ runner.temp }}/final_list.json" candidate-results/final-list.json
          cp "${{ runner.temp }}/details.json" candidate-results/details.json
          git add candidate-results/final-list.json candidate-results/details.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish restaurant details"
          for i in 1 2 3 4 5; do git push && break; git pull --rebase origin DEV; done
