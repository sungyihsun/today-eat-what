name: Search mall (雨天首選) restaurant candidates

on:
  push:
    branches: [DEV]
    paths:
      - scripts/mall-restaurants/search_mall_restaurants.py
      - scripts/mall-restaurants/fetch_details_mall.py
      - .github/workflows/search-mall-restaurants.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Resolve malls and search tenant candidates
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 scripts/mall-restaurants/search_mall_restaurants.py

      - name: Select final candidates (manually curated after 3 automatic rounds) and fetch details
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          # Rounds 1-3 iterated on the SEARCH mechanics (searchText+
          # locationBias returned zero for most malls; switching to
          # searchNearby fixed recall but a naive distance/type filter still
          # let in neighboring-block restaurants close to a mall but in a
          # separate building — e.g. 大遠百's 300m radius pulled in an entire
          # nearby 勝利路/石坊街 restaurant cluster that is NOT inside the
          # department store). This step is hand-picked after computing each
          # candidate's (road name, building number) from its own
          # formattedAddress and keeping only exact matches against the
          # mall's own resolved address (candidate-results/mall-anchors.json)
          # — normalizing the 区/區 and 号/號 simplified-character variants
          # Google occasionally returns, which had silently dropped genuine
          # iFG遠雄自由行 tenants in an earlier pass. Three further manual
          # exclusions after that: "Big City遠東巨城購物中心" (the mall
          # itself, not a restaurant), "築間鍋物燒肉放題 竹北享平方店" (very
          # likely the same restaurant as the already-listed "築間幸福鍋物
          # 火烤雙饗 竹北享平方店", not a second location), and "亞尼克新竹
          # 湳雅店" (its own address string says it's inside "大魯閣湳雅廣場"
          # — a different named venue that happens to share iFG's street
          # address, not actually iFG遠雄自由行 itself).
          selected = {
            "新竹巨城": [
              "時時香 - 新竹巨城店", "新馬辣經典麻辣鍋-新竹巨城店", "開飯川食堂 新竹巨城店",
              "藍象廷泰式火鍋 新竹巨城店", "朱記餡餅粥店 巨城百貨新竹店", "糖朝 新竹巨城店",
              "MO-MO-PARADISE 新竹巨城牧場", "乾杯燒肉居酒屋 新竹巨城店", "忠青商行 新竹巨城店",
              "くら寿司 藏壽司 新竹巨城店",
            ],
            "新竹大遠百": [
              "鼎泰豐 新竹店",
              "新竹燒烤/牛角日本燒肉專門店-新竹大遠百店/新竹吃到飽/日式餐廳/新竹大遠百美食",
              "朱記餡餅粥店 大遠百新竹店", "Starbucks星巴克 西大門市",
            ],
            "竹北遠百": [
              "開飯川食堂 竹北遠百店", "青鳥旅新竹竹北遠百B2店",
              "四川吳抄手 Chili House 遠百竹北店 Zhubei", "Cold Stone酷聖石冰淇淋竹北門市",
              "上菜 片皮鴨專賣店 新竹遠百竹北店", "Woosa洋食パンケーキ 屋莎洋食鬆餅屋 竹北遠百店",
              "漢來上海湯包 新竹遠百竹北店", "涓豆腐 竹北遠百店", "時時香 遠百竹北店",
              "一風堂遠百竹北店",
            ],
            "享平方": [
              "金色三麥 新竹竹北店", "山口六家食堂", "豆腐村 Tofu Village - 竹北享平方店",
              "樂葵法式鐵板燒-竹北店 | Le Goût Teppanyaki",
            ],
            "iFG遠雄自由行": [
              "瓦城泰國料理 新竹遠雄店", "MAGiC TOUCH点爭鮮-iFG遠雄新竹店｜日式料理壽司生魚片",
              "石二鍋 新竹遠雄店", "銀座杏子日式豬排-iFG遠雄廣場新竹店",
              "丸亀製麵 遠雄新竹店 烏龍麵餐廳",
              "來吧！肉夯夯韓式燒肉吃到飽湳雅店ROU*HANG BBQ KOREA RESTAURANT",
            ],
          }
          json.dump(selected, open("candidate-results/mall-final-list.json", "w"), ensure_ascii=False, indent=2)
          for k, v in selected.items():
              print(k, len(v))
          PY
          python3 scripts/mall-restaurants/fetch_details_mall.py

      - name: Publish candidate results to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/mall-candidates.json candidate-results/mall-anchors.json candidate-results/mall-final-list.json candidate-results/mall-details.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish mall-restaurant (雨天首選) candidates"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest DEV and retrying ($i)"
            git fetch origin DEV
            git rebase origin/DEV
          done
          exit 1
