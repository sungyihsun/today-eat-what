name: Search Cheongsapo restaurant/shopping candidates

on:
  push:
    branches: [DEV]
    paths:
      - scripts/busan-trip/search_cheongsapo.py
      - scripts/busan-trip/fetch_details_cheongsapo.py
      - .github/workflows/search-cheongsapo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: DEV

      - name: Search 靑沙浦 candidates
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          test -n "$GOOGLE_PLACES_API_KEY"
          python3 scripts/busan-trip/search_cheongsapo.py

      - name: Pick final list and fetch details
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          # Hand-picked from 33 餐廳 candidates: genuine meal restaurants
          # (noodles / grilled eel & scallop / seafood / Japanese eel),
          # deliberately skipping the many cafes clustered on this street
          # since those aren't what "餐廳" means here. "조개뷰 해운대본점"
          # (248.4m, would otherwise be a top pick) is already in the site
          # from an earlier 靑沙浦 batch — skipped as a duplicate.
          # 逛街: no genuine shopping venue found within radius — the one
          # candidate ("clamsand Busan") is a cafe/gift-shop hybrid, not
          # real shopping, so it's left out rather than padded in.
          python3 -c "
          import json
          final = {
              '餐廳': ['青沙浦 米線', '모리구이 음식점', '팔도미역 청사포점(Paldomiyeok chengsapo)', '燈塔烤鰻烤扇貝', 'Cheongsapo Heaundae Gui', '道熙家', 'Haerim Restaurant', '우나쥬 (UNAJU)'],
          }
          json.dump(final, open('candidate-results/cheongsapo-final-list.json', 'w'), ensure_ascii=False, indent=2)
          "
          python3 scripts/busan-trip/fetch_details_cheongsapo.py

      - name: Publish candidate results to DEV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate-results/cheongsapo-anchor.json candidate-results/cheongsapo-candidates.json candidate-results/cheongsapo-final-list.json candidate-results/cheongsapo-details.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish Cheongsapo candidates"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest DEV and retrying ($i)"
            git fetch origin DEV
            git rebase origin/DEV
          done
          exit 1
