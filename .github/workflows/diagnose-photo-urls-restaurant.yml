name: Diagnose restaurant photo URLs

# Trigger: commit candidate-results/photo-diagnose-trigger.txt to DEV. Samples stored photo URLs from the
# CSV and reports HEAD vs GET status/size, to find out why the monthly audit's HEAD check passed for
# links that browsers can no longer load.
on:
  push:
    branches: [DEV]
    paths:
      - candidate-results/photo-diagnose-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV
      - name: Probe sample URLs
        run: |
          python3 - <<'PY'
          import csv, re, urllib.request, random
          rows = list(csv.reader(open('supabase/restaurants-import.csv', encoding='utf-8')))
          hdr = rows[0]; pi = hdr.index('photos'); ni = hdr.index('name')
          def urls(r):
              raw = r[pi]
              return [p.strip('"') for p in raw[1:-1].split(',') if p] if raw.startswith('{') else []
          random.seed(7)
          samples = []
          for want in ('grass-cs', 'place-photos'):
              pool = [(r[ni], u) for r in rows[1:] for u in urls(r)[:1] if want in u]
              samples += random.sample(pool, min(6, len(pool)))
          for r in rows[1:]:
              if r[ni] in ('金鶴呷 熱炒', '晨光早餐'):
                  samples += [(r[ni], u) for u in urls(r)[:1]]
          def probe(method, u, headers=None):
              req = urllib.request.Request(u, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read(200000) if method == 'GET' else b''
                      return f"{resp.status} {resp.headers.get('content-type')} len={resp.headers.get('content-length') or len(body)}"
              except Exception as e:
                  return f"ERR {e}"
          UA = {'User-Agent': 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36'}
          for name, u in samples:
              kind = 'grass-cs' if 'grass-cs' in u else 'place-photos'
              print(f"{name} [{kind}] ...{u[-30:]}")
              print("   HEAD :", probe('HEAD', u))
              print("   GET  :", probe('GET', u))
              print("   GET+UA:", probe('GET', u, UA))
          PY
