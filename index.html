<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今天吃什麼 — 新竹市 × 竹北市 餐廳地圖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --ink:#1b1a17;
    --paper:#f5f1e8;
    --paper2:#ece4d3;
    --seal:#b5453a;
    --gold:#d9861f;
    --jade:#3c5a4b;
    --line:#e4dcc9;
    --white:#fffdfa;
    --card-radius:22px;
    --pill-radius:999px;
    --shadow-sm:0 1px 2px rgba(27,26,23,0.05), 0 1px 1px rgba(27,26,23,0.04);
    --shadow-md:0 8px 24px rgba(27,26,23,0.08), 0 2px 6px rgba(27,26,23,0.05);
    --shadow-lg:0 16px 40px rgba(27,26,23,0.14), 0 4px 10px rgba(27,26,23,0.06);
    --safe-l:max(6vw, env(safe-area-inset-left));
    --safe-r:max(6vw, env(safe-area-inset-right));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,134,59,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(181,69,58,0.04), transparent 45%);
  }
  ::selection{ background:var(--seal); color:var(--white); }
  img{ display:block; }
  button, select, input{ font:inherit; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  header{
    position:relative;
    padding:52px var(--safe-r) 36px var(--safe-l);
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:14px;
    color:var(--seal);
    letter-spacing:2.5px;
    margin-bottom:10px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(36px,6.5vw,72px);
    line-height:1.05;
    letter-spacing:0.5px;
  }
  h1 .accent{ color:var(--seal); }
  .subhead{
    margin-top:14px;
    max-width:560px;
    font-size:15px;
    line-height:1.8;
    color:#5a5548;
  }
  .stamp{
    position:absolute;
    top:50px; right:var(--safe-r);
    width:88px; height:88px;
    border-radius:50%;
    background:linear-gradient(155deg, var(--seal), #8f342b);
    box-shadow:var(--shadow-md);
    display:flex; align-items:center; justify-content:center;
    color:var(--white);
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:13px;
    line-height:1.35;
    text-align:center;
    letter-spacing:1px;
  }
  @media (max-width:760px){ .stamp{ display:none; } }

  .controls{
    position:sticky; top:0; z-index:30;
    background:rgba(245,241,232,0.62);
    backdrop-filter:blur(24px) saturate(1.8);
    -webkit-backdrop-filter:blur(24px) saturate(1.8);
    border-bottom:1px solid rgba(255,255,255,0.5);
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 8px 20px rgba(27,26,23,0.04);
    padding:14px var(--safe-r) 14px var(--safe-l);
  }
  .search-box{
    position:relative; display:flex; align-items:center;
    height:38px; border-radius:999px; flex:0 0 auto;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.32);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    width:38px; overflow:hidden;
    transition:width .25s cubic-bezier(.4,0,.2,1), background .2s ease, box-shadow .2s ease;
  }
  .search-box.expanded{ width:min(260px, 62vw); background:rgba(255,255,255,0.75); box-shadow:0 0 0 3px rgba(181,69,58,0.16), var(--shadow-sm); }
  .search-icon-btn{
    width:38px; height:38px; flex:0 0 auto; border:none; background:transparent; padding:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#5a5548;
  }
  .search-box input{
    border:none; background:transparent; outline:none;
    height:36px; width:0; min-width:0; padding:0; opacity:0;
    font-size:16px; flex:1 1 auto;
    transition:opacity .18s ease, width .25s ease, padding .25s ease;
  }
  .search-box.expanded input{ width:100%; opacity:1; padding:0 14px 0 0; }
  .search-box input::placeholder{ color:#8a8474; }

  .filter-row{
    display:flex; gap:9px; align-items:center; flex-wrap:wrap;
  }
  .filter-row-2{
    margin-top:9px;
  }

  /* Horizontally scrollable chip strip of area/city buttons, frosted glass */
  .area-toggle{
    display:flex; gap:6px; align-items:center; flex:0 0 auto; max-width:100%;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .area-toggle::-webkit-scrollbar{ display:none; }
  .area-toggle button{
    flex:0 0 auto;
    padding:8px 15px; height:38px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.28);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    font-weight:600; font-size:13.5px;
    cursor:pointer; color:#5a5548; transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .area-toggle button.active{ background:rgba(255,255,255,0.85); color:var(--ink); box-shadow:var(--shadow-sm); font-weight:700; }
  .area-toggle button.area-back{ background:transparent; border-style:dashed; color:#8a8474; font-weight:500; }
  .area-toggle button.area-done{ background:var(--jade); color:var(--white); border-color:var(--jade); font-weight:700; }
  .area-toggle button.area-future{
    background:rgba(60,55,48,0.05); border-color:rgba(60,55,48,0.08);
    color:#b3ada0; cursor:not-allowed; font-weight:500;
  }
  .area-toggle.collapsed button:not(.active){ display:none; }
  .area-toggle.collapsed button.active{ padding-right:12px; }
  .area-toggle.collapsed button.active::after{
    content:"▾"; margin-left:6px; font-size:10px; opacity:.7;
  }

  .hours-icon-btn, .fav-toggle{
    display:flex; align-items:center; gap:7px;
    height:38px; padding:0 15px;
    border:1px solid rgba(255,255,255,0.5);
    border-radius:999px;
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    flex:0 0 auto;
    user-select:none;
    transition:background .2s ease, color .2s ease;
  }
  .fav-toggle{ background:rgba(60,90,75,0.12); color:var(--jade); }
  /* Idle 灰色，跟其他未選取的篩選 chip 一致，暗示「還沒篩選、可以點」；
     .active 時變回跟其他篩選 chip 選取時一樣的深綠色，一眼就能看出差異。 */
  .hours-icon-btn{ background:rgba(255,255,255,0.28); color:#5a5548; }
  .hours-icon-btn.active{ background:rgba(60,90,75,0.88); color:var(--white); }
  .hours-icon-btn svg{ flex:0 0 auto; display:block; }

  .fav-toggle{ background:rgba(181,69,58,0.12); color:var(--seal); }
  .fav-toggle.active{ background:rgba(181,69,58,0.88); color:var(--white); }
  .fav-toggle .count{
    font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px;
    background:rgba(181,69,58,0.16); color:var(--seal);
  }
  .fav-toggle.active .count{ background:rgba(255,255,255,0.25); color:var(--white); }

  .share-btn{
    height:38px; padding:0 15px; border:1px solid rgba(255,255,255,0.5); border-radius:999px;
    background:rgba(255,255,255,0.32); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    cursor:pointer; font-size:13.5px; font-weight:600;
    color:var(--ink); flex:0 0 auto; transition:background .2s ease;
  }
  .share-btn:hover{ background:rgba(255,255,255,0.55); }
  .auth-btn{
    height:38px; padding:0 15px; border:1px solid rgba(255,255,255,0.5); border-radius:999px;
    background:rgba(60,90,75,0.12); color:var(--jade); cursor:pointer;
    font-size:13.5px; font-weight:600; flex:0 0 auto;
  }
  .auth-btn:hover{ background:rgba(60,90,75,0.22); }

  .shared-banner{
    margin:0 var(--safe-r) 0 var(--safe-l);
    margin-top:-1px;
    background:rgba(60,90,75,0.82); color:var(--white);
    backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    padding:14px 18px; border-radius:0 0 16px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    font-size:13.5px; font-weight:500;
    box-shadow:var(--shadow-md);
  }
  .shared-banner-actions{ display:flex; gap:10px; flex:0 0 auto; }
  .shared-banner-actions button{
    padding:8px 14px; border-radius:999px; border:1.5px solid rgba(255,255,255,0.7);
    background:transparent; color:var(--white); font-weight:700; font-size:12.5px; cursor:pointer;
    min-height:36px;
  }
  .shared-banner-actions button:hover{ background:rgba(255,255,255,0.18); }
  #sharedAdoptBtn{ background:rgba(255,255,255,0.9); color:var(--jade); border-color:rgba(255,255,255,0.9); }
  #sharedAdoptBtn:hover{ background:rgba(255,255,255,0.75); }

  .toast{
    position:fixed; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px) scale(0.95);
    background:rgba(27,26,23,0.72); backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    color:var(--paper); padding:12px 22px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.12);
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .25s cubic-bezier(.4,0,.2,1), transform .25s cubic-bezier(.4,0,.2,1); z-index:50;
    box-shadow:var(--shadow-lg); max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }

  /* "幫我選" — a small rule-based guided picker, no external AI/API involved */
  .picker-fab{
    position:fixed; right:max(20px, env(safe-area-inset-right));
    bottom:max(20px, env(safe-area-inset-bottom)); z-index:60;
    width:56px; height:56px; border-radius:50%; border:none;
    background:linear-gradient(155deg, var(--seal), #8f342b);
    color:var(--white); display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-lg); cursor:pointer;
    transition:transform .2s cubic-bezier(.34,1.3,.64,1);
  }
  .picker-fab:hover{ transform:scale(1.06); }
  .picker-fab:active{ transform:scale(0.94); }
  .picker-fab.hide{ display:none; }

  .picker-panel{
    position:fixed; right:max(20px, env(safe-area-inset-right));
    bottom:max(88px, calc(env(safe-area-inset-bottom) + 88px));
    z-index:60; width:min(360px, calc(100vw - 40px)); max-height:min(560px, 72vh);
    background:rgba(250,247,241,0.92); backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6);
    border:1px solid rgba(255,255,255,0.6); border-radius:20px;
    box-shadow:var(--shadow-lg); display:none; flex-direction:column; overflow:hidden;
    transform-origin:bottom right;
  }
  .picker-panel.open{ display:flex; animation:pickerIn .22s cubic-bezier(.34,1.3,.64,1); }
  @keyframes pickerIn{ from{ opacity:0; transform:scale(0.9) translateY(10px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .picker-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px;
    border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .picker-header button{ border:none; background:none; cursor:pointer; font-size:16px; color:#8a8474; padding:4px; }
  .picker-body{ padding:14px 16px; overflow-y:auto; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:10px; }
  .picker-body > *{ flex-shrink:0; }
  .picker-msg{
    align-self:flex-start; background:var(--paper2); color:var(--ink);
    padding:9px 13px; border-radius:14px 14px 14px 4px; font-size:13.5px; line-height:1.6; max-width:88%;
  }
  .picker-choices{ display:flex; flex-wrap:wrap; gap:7px; }
  .picker-choices button{
    padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--white); color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .picker-choices button:hover{ background:var(--jade); color:var(--white); border-color:var(--jade); }
  .picker-answer{
    align-self:flex-end; background:var(--jade); color:var(--white);
    padding:9px 13px; border-radius:14px 14px 4px 14px; font-size:13.5px; font-weight:600; max-width:88%;
  }
  .picker-result-card{
    border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--white);
  }
  .picker-result-card img{ width:100%; height:120px; object-fit:cover; display:block; }
  .picker-result-body{ padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .picker-result-name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px; }
  .picker-result-meta{ font-size:12.5px; color:#6b6656; }
  .picker-result-actions{ display:flex; gap:8px; margin-top:4px; }
  .picker-result-actions button, .picker-result-actions a{
    flex:1; text-align:center; padding:8px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:700; cursor:pointer;
    text-decoration:none; display:block;
  }
  .picker-result-actions .primary{ background:var(--seal); color:var(--white); border-color:var(--seal); }

  .time-select-row{
    display:none;
    flex-direction:column; gap:10px;
    margin-top:12px;
    font-size:13px; color:#5a5548;
  }
  .time-select-row.visible{ display:flex; }
  .time-custom-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .time-select-row select{
    height:38px; padding:0 10px; border:1px solid rgba(255,255,255,0.5); border-radius:10px;
    background:rgba(255,255,255,0.35); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    font-size:14px;
  }
  .meal-presets{ display:flex; gap:7px; flex-wrap:wrap; }
  .meal-presets button{
    height:34px; padding:0 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.32);
    backdrop-filter:blur(12px) saturate(1.4); -webkit-backdrop-filter:blur(12px) saturate(1.4);
    font-weight:600; font-size:13px; color:#5a5548; cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .meal-presets button.active{ background:rgba(60,90,75,0.88); color:var(--white); border-color:transparent; }

  .cat-select-wrap{
    position:relative; flex:0 0 auto;
    display:flex; align-items:center;
  }
  .cat-select-wrap::after{
    content:"";
    position:absolute; right:15px; top:50%; width:7px; height:7px;
    border-right:2px solid #8a8474; border-bottom:2px solid #8a8474;
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .cat-select{
    appearance:none; -webkit-appearance:none;
    height:38px;
    padding:0 34px 0 16px;
    border:1px solid rgba(255,255,255,0.5); border-radius:999px;
    background:rgba(255,255,255,0.32); color:var(--ink);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    font-weight:600; font-size:13.5px;
    cursor:pointer; max-width:46vw;
  }
  .cat-select:focus{ outline:none; box-shadow:0 0 0 3px rgba(217,134,31,0.25); }

  .result-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .result-count{ font-size:12.5px; color:#8a8474; }
  .sort-select-wrap{ flex:0 0 auto; }
  .sort-select-wrap .cat-select{
    height:32px; padding:0 28px 0 12px; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,0.2); border-color:rgba(255,255,255,0.4);
  }

  /* Horizontal chip-scroll strip on phones — classic iOS filter-bar pattern */
  @media (max-width:720px){
    .filter-row{
      flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
      margin:0 calc(-1 * var(--safe-l)) 0 calc(-1 * var(--safe-l));
      padding:2px var(--safe-l) 6px;
    }
    .filter-row::-webkit-scrollbar{ display:none; }
    .filter-row > *{ scroll-snap-align:start; }
    .cat-select{ max-width:56vw; }

    /* filter-row-2 (category + sub-category + time) wraps instead of scrolling —
       two selects at once would otherwise force an absurdly wide scroll strip. */
    .filter-row-2{
      flex-wrap:wrap; overflow-x:visible;
      margin:0; padding:0;
    }
    .filter-row-2 .cat-select{ max-width:44vw; }
  }

  main{ padding:32px var(--safe-r) 100px var(--safe-l); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
  .load-more-wrap{ text-align:center; margin-top:28px; }
  .load-more-btn{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    padding:12px 28px; border-radius:var(--pill-radius); border:1px solid var(--line);
    background:var(--white); color:var(--jade); box-shadow:var(--shadow-sm);
  }
  .load-more-btn:hover{ background:var(--jade); color:var(--white); border-color:var(--jade); }

  /* 旅遊版：星宇航空風格的黑金配色，跟站內其他區域（米黃/赭紅/墨綠）拉開，帶出「出國」「精品航空」的質感 */
  .trip-toggle-btn{
    display:flex; align-items:center; gap:7px;
    height:38px; padding:0 15px; border:1px solid rgba(22,20,15,0.4); border-radius:999px;
    background:rgba(22,20,15,0.05); color:#201d16; cursor:pointer;
    font-size:13.5px; font-weight:600; flex:0 0 auto; transition:background .2s ease;
  }
  .trip-toggle-btn svg{ flex:0 0 auto; }
  .trip-toggle-btn:hover{ background:rgba(184,144,47,0.18); }
  .trip-toggle-btn.active{ background:#16140f; color:#c9a227; border-color:#16140f; }

  .trip-picker{
    margin:0 var(--safe-r) 14px var(--safe-l); display:flex; flex-direction:column; gap:10px;
    background:linear-gradient(135deg, rgba(22,20,15,0.05), rgba(184,144,47,0.12));
    border:1px solid rgba(184,144,47,0.4); border-radius:18px; padding:14px 16px;
  }
  .trip-picker-label{ font-size:12.5px; font-weight:600; color:#8a6d23; }
  .trip-picker .area-toggle button.active{ background:#16140f; color:#c9a227; border-color:#16140f; }
  .trip-picker .area-toggle button:not(.active):not(.area-future){ border-color:rgba(184,144,47,0.45); color:#201d16; }

  /* While browsing 釜山, retint the whole site's accent color (chips, fav
     toggle, hours toggle, load-more hover — anything using --jade) to a
     champagne gold instead of duplicating every rule for a second color
     scheme; the black comes from the toggle/picker rules above. */
  body.busan-mode{ --jade:#a9792a; }

  /* 本地版：餐廳／服飾 常駐雙頁籤，放在標題下方、篩選列上方，跟餐廳分類 chip
     完全分開，避免服飾分類混進 CAT_GROUPS 的燒烤/日式那排。旅遊版（釜山）啟用
     時整排隱藏——服飾/餐廳頁籤只切換「在地版」內部的兩種本地資料集。 */
  .mode-tabs{
    display:flex; justify-content:center; gap:8px;
    margin:0 var(--safe-r) 18px var(--safe-l);
  }
  .mode-tab{
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
    padding:10px 22px; border-radius:999px; border:1px solid var(--line);
    background:var(--white); color:var(--ink); box-shadow:var(--shadow-sm);
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .mode-tab.active{ background:var(--jade); color:var(--white); border-color:var(--jade); }
  .mode-tab:not(.active):hover{ border-color:var(--jade); }
  .card{
    background:rgba(255,253,250,0.78); border:1px solid rgba(255,255,255,0.6); border-radius:var(--card-radius);
    backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5);

function fmtHM(min){
  const h = Math.floor((min%1440)/60);
  const m = min%60;
  const ampm = h<12 ? "上午" : "下午";
  let h12 = h%12; if(h12===0) h12=12;
  return `${ampm}${h12}:${String(m).padStart(2,'0')}`;
}

function hoursSummary(name){
  const week = HOURS[name];
  if(!week) return "營業時間請洽店家";
  const today = (new Date().getDay()+6)%7;
  const ranges = week[today];
  if(!ranges || ranges.length===0) return `${DAY_NAMES[today]}公休`;
  return `${DAY_NAMES[today]} ` + ranges.map(r=>`${fmtHM(r[0])}–${fmtHM(r[1])}`).join('、');
}

function isOpenAt(name, dayIdx, minutes){
  const week = HOURS[name];
  if(!week) return null;
  const check = (d, absMin) => {
    const ranges = week[((d%7)+7)%7];
    return ranges.some(r => absMin >= (d*1440+r[0]) && absMin < (d*1440+r[1]));
  };
  const abs = dayIdx*1440 + minutes;
  if(check(dayIdx, abs)) return true;
  if(check(dayIdx-1, abs)) return true;
  if(check(dayIdx+7, abs+10080)) return true;
  return false;
}

// Is the restaurant open at any point during [startMin,endMin) on dayIdx — used
// for meal-period presets (早餐/中午/晚餐…) rather than a single point in time.
function isOpenDuring(name, dayIdx, startMin, endMin){
  const week = HOURS[name];
  if(!week) return null;
  const overlaps = (d, absS, absE) => {
    const ranges = week[((d%7)+7)%7];
    return ranges.some(r => (d*1440+r[0]) < absE && (d*1440+r[1]) > absS);
  };
  const absS = dayIdx*1440 + startMin, absE = dayIdx*1440 + endMin;
  if(overlaps(dayIdx, absS, absE)) return true;
  if(overlaps(dayIdx-1, absS, absE)) return true;
  if(overlaps(dayIdx+7, absS+10080, absE+10080)) return true;
  return false;
}

// Rendering every matched restaurant's cards (and their photo carousels) at
// once could put 400+ cards / 1000+ <img> in the DOM in one pass, which is a
// real cause of mobile Safari tab crashes ("A Problem Repeatedly Occurred")
// on long lists — page the results instead, growing visibleCount only when
// the user asks for more.
const PAGE_SIZE = 30;

async function loadRestaurantsFromSupabase(){
  const config = window.SUPABASE_CONFIG;
  if(!config?.url || !config?.anonKey) return;

  const endpoint = `${config.url.replace(/\/+$/, '')}/rest/v1/restaurants?select=id,name,area,lat,lng,categories,price,rating,description,tags,phone,parking_tier,parking_sub,photos,maps_url,hours&order=id`;
  const response = await fetch(endpoint, {
    headers: {
      apikey: config.anonKey,
      Authorization: `Bearer ${config.anonKey}`,
    },
  });
  if(!response.ok) throw new Error(`Supabase restaurants request failed (${response.status})`);

  const rows = await response.json();
  if(!Array.isArray(rows) || rows.length === 0) throw new Error('Supabase restaurants table is empty');

  restaurants = rows.map(row=>({
    id: row.id,
    name: row.name,
    area: row.area,
    lat: row.lat,
    lng: row.lng,
    cat: row.categories || [],
    price: row.price,
    rating: Number(row.rating),
    desc: row.description || '',
    tags: row.tags || [],
    phone: row.phone || '',
    parkingTier: row.parking_tier || 'unknown',
    parkingSub: row.parking_sub || '',
    photos: row.photos || [],
    mapsUrl: row.maps_url,
  }));
  HOURS = Object.fromEntries(rows.map(row=>[row.name, row.hours || []]));
  // Reassigns HOURS wholesale from the Supabase rows, which wipes out the
  // BUSAN_HOURS/TAIWAN_CLOTHING_HOURS merges done at parse time
  // (busanRestaurants/taiwanClothingRestaurants are deliberately kept out of
  // Supabase) — re-merge so 旅遊版/服飾 restaurants keep their real opening
  // hours instead of falling back to "營業時間請洽店家".
  Object.assign(HOURS, BUSAN_HOURS);
  Object.assign(HOURS, TAIWAN_CLOTHING_HOURS);
}

// 口袋名單／我的最愛：存在瀏覽器 localStorage，不用登入，只有這台裝置這個瀏覽器看得到
const FAV_KEY = 'zhushitu_favorites';
const AUTH_KEY = 'today_eat_what_session';
let authSession = null;
const supabaseConfig = window.SUPABASE_CONFIG;

function supabaseHeaders(){
  return {
    apikey: supabaseConfig.anonKey,
    Authorization: `Bearer ${authSession?.access_token || supabaseConfig.anonKey}`,
    'Content-Type': 'application/json',
  };
}
function updateAuthUi(){
  authBtn.textContent = authSession?.user?.email ? `登出 ${authSession.user.email}` : '使用 Google 登入';
  authBtn.title = authSession ? '登出 Supabase' : '使用 Google 登入，同步收藏';
}
async function finishGoogleLogin(){
  // Only process the OAuth callback if we initiated the login flow from this page.
  if(!localStorage.getItem('auth_in_progress')) return;
  const hash = new URLSearchParams(location.hash.slice(1));
  const accessToken = hash.get('access_token');
  if(!accessToken){ localStorage.removeItem('auth_in_progress'); return; }
  const response = await fetch(`${supabaseConfig.url}/auth/v1/user`, {
    headers:{apikey:supabaseConfig.anonKey, Authorization:`******  `}
  });
  if(!response.ok) throw new Error(`Google 登入失敗 (${response.status})`);
  authSession = {access_token:accessToken, user:await response.json()};
  localStorage.setItem(AUTH_KEY, JSON.stringify(authSession));
  localStorage.removeItem('auth_in_progress');
  history.replaceState(null, '', location.pathname + location.search);
  updateAuthUi();
}
async function loadRemoteFavorites(){
  const response = await fetch(`${supabaseConfig.url}/rest/v1/favorites?select=restaurant_id`, {headers:supabaseHeaders()});
  if(!response.ok) throw new Error(`收藏同步失敗 (${response.status})`);
  const ids = new Set((await response.json()).map(row=>row.restaurant_id));
  restaurants.forEach(r=>{ if(ids.has(r.id)) favorites.add(r.name); });
  saveFavorites(favorites);
}
async function syncFavorite(name, isFavorite){
  if(!authSession) return;
  const restaurant = restaurants.find(r=>r.name===name);
  if(!restaurant?.id) throw new Error('找不到餐廳資料編號');
  const endpoint = `${supabaseConfig.url}/rest/v1/favorites`;
  const response = await fetch(isFavorite ? endpoint : `${endpoint}?restaurant_id=eq.${restaurant.id}&user_id=eq.${authSession.user.id}`, {
    method:isFavorite ? 'POST' : 'DELETE',
    headers:{...supabaseHeaders(), Prefer:'resolution=merge-duplicates,return=minimal'},
    body:isFavorite ? JSON.stringify({user_id:authSession.user.id,restaurant_id:restaurant.id}) : undefined,
  });
  if(!response.ok) throw new Error(`收藏同步失敗 (${response.status})`);
}
async function initAuth(){
  if(!supabaseConfig?.url || !supabaseConfig?.anonKey) return;
  await finishGoogleLogin();
  const raw = localStorage.getItem(AUTH_KEY);
  if(!authSession && raw){ try{ authSession = JSON.parse(raw); }catch(error){ localStorage.removeItem(AUTH_KEY); } }
  updateAuthUi();
  if(authSession?.access_token){
    try{ await loadRemoteFavorites(); }catch(error){ localStorage.removeItem(AUTH_KEY); authSession=null; updateAuthUi(); showToast('登入狀態已失效，請重新登入'); }
  }
}
authBtn.addEventListener('click', async ()=>{
  if(authSession){
    const response = await fetch(`${supabaseConfig.url}/auth/v1/logout`, {method:'POST',headers:supabaseHeaders()});
    if(!response.ok) throw new Error(`登出失敗 (${response.status})`);
    authSession=null; localStorage.removeItem(AUTH_KEY); localStorage.removeItem('auth_in_progress'); updateAuthUi(); showToast('已登出');
    return;
  }
  // mark that this page initiated the login flow; finishGoogleLogin will only
  // process the callback if this flag is present, preventing auto-prompts.
  localStorage.setItem('auth_in_progress','1');
  const redirectTo = `${location.origin}${location.pathname}`;
  const authUrl = `${supabaseConfig.url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(redirectTo)}`;
  location.assign(authUrl);
});

// 靠 switchLocalMode() 整組 swap，這樣男裝/女裝等分類 chip 只會在服飾頁籤
// 出現，不會混進燒烤/日式那排。分類數不多，不需要像「其他」那樣的子選單。
const CAT_GROUPS_CLOTHING = {

  '女裝': ['女裝'],
  '鞋包配件': ['鞋包配件'],
  '平價服飾': ['平價服飾'],
  '選品店': ['選品店'],
};
const SUB_CAT_GROUPS_CLOTHING = {};
// Swappable bindings — switchLocalMode()/enterBusanMode()/exitBusanMode()
// reassign these three together (mirrors the AREA_REGIONS let-swap pattern).
let CAT_GROUPS = CAT_GROUPS_FOOD;
let SUB_CAT_GROUPS = SUB_CAT_GROUPS_FOOD;
let ALL_CAT_GROUPS = Object.assign({}, CAT_GROUPS, SUB_CAT_GROUPS);
function hasAnyMatch(label){
  return ALL_CAT_GROUPS[label].some(c => restaurants.some(r => r.cat.includes(c)));
}
// `restaurants` starts as a small preloaded slice (see INITIAL_RESTAURANT_COUNT)
// and gets replaced with the full dataset once Supabase/embedded data finishes
// loading. These lists must be recomputed after that swap — recomputeCategoryLists()
// is called again at the end of initializeApp() — or any category absent from
// the initial slice (e.g. 火鍋 if no hotpot place happens to be in the first
// dozen rows) would stay permanently hidden from the filter chips.
let PRIMARY_CATEGORIES = [];
let SUB_CATEGORIES = [];
function recomputeCategoryLists(){
  PRIMARY_CATEGORIES = Object.keys(CAT_GROUPS).filter(hasAnyMatch);
  SUB_CATEGORIES = Object.keys(SUB_CAT_GROUPS).filter(hasAnyMatch);
}
recomputeCategoryLists();
function catGroupMatches(r, label){
  return ALL_CAT_GROUPS[label].some(c => r.cat.includes(c));
}

// A restaurant can belong to several categories at once (e.g. a hotpot buffet
// is both "火鍋/鍋物" and "吃到飽") — r.cat is always an array.
// Does restaurant r pass every active structural filter except the one named in `exclude`?
// Used to figure out which dropdown options would still yield results.
// When a meal-period preset (早餐/中午/晚餐…) is active, "open" means "open at
// any point during that window" rather than at one exact instant.
function isOpenForFilter(r, cp){
  if(r.cat.includes('夜市')) return true;
  return state.rangeStart!==null
    ? isOpenDuring(r.name, cp.day, state.rangeStart, state.rangeEnd)===true
    : isOpenAt(r.name, cp.day, cp.minutes)===true;
}

// A selected primary chip normally matches broadly (catGroupMatches), except
// "其他": once a user narrows it via the sub-picker, "其他" only matches that
// one narrower type instead of the whole catch-all bucket. Other selected
// chips are unaffected (OR/union semantics), so narrowing "其他" only shrinks
// its own contribution to the overall match set.
function catLabelMatches(r, label, allowNarrow){
  if(label==='其他' && allowNarrow && state.subCat!=='all') return catGroupMatches(r, state.subCat);
  return catGroupMatches(r, label);
}

function matchesStructural(r, cp, exclude){
  const areaOk = state.area==='all' || r.area===state.area;
  const catOk = exclude==='cat' || state.cats.length===0
    || state.cats.some(label=> catLabelMatches(r, label, exclude!=='subCat'));
  const openOk = !state.onlyOpen || isOpenForFilter(r, cp);
  return areaOk && catOk && openOk;
}

function availableGroups(cp, exclude, labels){
  const set = new Set();
  restaurants.forEach(r=>{
    if(!matchesStructural(r, cp, exclude)) return;
    labels.forEach(label=>{ if(catGroupMatches(r, label)) set.add(label); });
  });
  return set;
}

function catSummaryLabel(){
  if(state.cats.length===0) return '全部分類';
  return state.cats.length > 1 ? state.cats.join('、') : state.cats[0];
}

let catUiExpanded = false; // whether the chip picker is open (UI-only, not a filter)

// Rebuild the multi-select category chip row so only options with at least
// one matching restaurant are selectable — chips already picked stay
// toggleable even at zero results, so a combo never silently traps the user.
// The 「其他」 sub-picker (single-select) only appears once 其他 itself is
// one of the selected chips, and only lists sub-types that actually occur.
function renderCatFilters(cp){
  const availCats = availableGroups(cp, 'cat', PRIMARY_CATEGORIES);

  catToggle.innerHTML = '';
  catToggle.classList.remove('collapsed');

  if(!catUiExpanded){
    const btn = document.createElement('button');
    btn.className = 'active';
    btn.textContent = catSummaryLabel();
    btn.addEventListener('click', ()=>{
      catUiExpanded = true;
      renderCatFilters(cp);
    });
    catToggle.appendChild(btn);
    catToggle.classList.add('collapsed');
  } else {
    const allBtn = document.createElement('button');
    allBtn.className = state.cats.length===0 ? 'active' : '';
    allBtn.textContent = '全部分類';
    allBtn.addEventListener('click', ()=>{
      state.cats = [];
      state.subCat = 'all';
      render();
    });
    catToggle.appendChild(allBtn);
    PRIMARY_CATEGORIES.forEach(label=>{
      const isOn = state.cats.includes(label);
      const hasResults = isOn || availCats.has(label);
      const btn = document.createElement('button');
      btn.textContent = (isOn ? '✓ ' : '') + label;
      if(!hasResults){
        btn.className = 'area-future';
        btn.disabled = true;
        btn.title = '此條件下無結果';
      } else {
        btn.className = isOn ? 'active' : '';
        btn.addEventListener('click', ()=>{
          if(isOn){
            state.cats = state.cats.filter(c=>c!==label);
            if(label==='其他') state.subCat = 'all';
          } else {
            state.cats = [...state.cats, label];
          }
          render();
        });
      }
      catToggle.appendChild(btn);
    });
    const doneBtn = document.createElement('button');
    doneBtn.className = 'area-done';
    doneBtn.textContent = '完成 ✓';
    doneBtn.addEventListener('click', ()=>{
      catUiExpanded = false;
      renderCatFilters(cp);
    });
    catToggle.appendChild(doneBtn);
  }

  if(!state.cats.includes('其他')){
    state.subCat = 'all';
    subCatSelectWrap.style.display = 'none';
    return;
  }
  const availSubCats = availableGroups(cp, 'subCat', SUB_CATEGORIES);
  if(state.subCat!=='all' && !availSubCats.has(state.subCat)) state.subCat = 'all';
  subCatSelectWrap.style.display = '';
  subCatSelect.innerHTML = '';
  const subAllOpt = document.createElement('option');
  subAllOpt.value='all'; subAllOpt.textContent='全部其他類型';
  subCatSelect.appendChild(subAllOpt);
  SUB_CATEGORIES.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c;
    opt.disabled = !availSubCats.has(c);
    opt.textContent = c + (availSubCats.has(c) ? '' : '（此條件下無結果）');
    subCatSelect.appendChild(opt);
  });
  subCatSelect.value = state.subCat;
}

subCatSelect.addEventListener('change', ()=>{

  render();
});

function buildTimeSelectors(){
  DAY_NAMES.forEach((d,i)=>{
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = d;
    daySelect.appendChild(opt);
  });
  for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=30){
      const opt = document.createElement('option');
      const val = h*60+m;
      opt.value = val;
      opt.textContent = fmtHM(val);
      timeSelect.appendChild(opt);
    }
  }
  const now = new Date();
  daySelect.value = (now.getDay()+6)%7;
  const nowMin = now.getHours()*60+now.getMinutes();
  timeSelect.value = Math.round(nowMin/30)*30 % 1440;
}

let userLocation = null; // {lat,lng} once the browser grants location access

// 兩點球面距離（公里），用來做「距離：近到遠」排序
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDistance(km){
  return km < 1 ? `${Math.round(km*1000)} 公尺` : `${km.toFixed(1)} 公里`;
}

// 卡片上的「距離你 xx」文字只看 userLocation 是否已設定（見 render() 的
// card-rating 區塊），不看目前排序方式——所以只要在載入時就靜靜要一次定位
// 權限，不用等使用者特地切到「距離：近到遠」排序才觸發，每張卡片就會直接
// 顯示距離。使用者若拒絕或瀏覽器不支援，就單純不顯示，不跳 toast 打擾。
function tryAutoLocate(){
  if(!navigator.geolocation || userLocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      render();
    },
    () => {}, // silently ignore denial/unavailable — sort dropdown still offers a manual retry
    { timeout: 10000 }
  );
}

sortSelect.addEventListener('change', ()=>{
  const val = sortSelect.value;
  if(val === 'distance' && !userLocation){
    if(!navigator.geolocation){
      showToast('這個瀏覽器不支援定位功能');
      sortSelect.value = state.sort;
      return;
    }
    showToast('正在取得你的位置…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        state.sort = 'distance';
        showToast('已定位，依距離排序中');
        render();
      },
      err => {
        showToast('無法取得位置，請確認已允許瀏覽器定位權限');
        sortSelect.value = state.sort;
      },
      { timeout: 10000 }
    );
    return;
  }
  state.sort = val;
  render();
});

daySelect.addEventListener('change', ()=>{
  state.customDay = parseInt(daySelect.value);
  renderMealPresets();
  render();
  updateHoursLabel();
});
timeSelect.addEventListener('change', ()=>{
  state.customTime = parseInt(timeSelect.value);
  state.rangeStart = null; state.rangeEnd = null;
  renderMealPresets();
  render();
  updateHoursLabel();
});
clearTimeBtn.addEventListener('click', ()=>{
  state.customDay = null; state.customTime = null;
  state.rangeStart = null; state.rangeEnd = null;
  const now = new Date();
  daySelect.value = (now.getDay()+6)%7;
  timeSelect.value = Math.round((now.getHours()*60+now.getMinutes())/30)*30 % 1440;
  renderMealPresets();
  updateHoursLabel();
  render();
});

function updateHoursLabel(){
  if(!state.onlyOpen){ hoursToggleLabel.textContent = "營業中"; return; }
  if(state.rangeStart!==null){
    const preset = MEAL_PRESETS.find(p=>p.start===state.rangeStart && p.end===state.rangeEnd);
    hoursToggleLabel.textContent = preset ? preset.label : "營業中";
    return;
  }
  if(state.customDay===null && state.customTime===null){
    // Filter is on but no specific preset/custom time chosen yet — it's
    // implicitly filtering by "open right now", so the label stays the
    // same as idle ("營業中"); the active pill styling shows it's engaged.
    hoursToggleLabel.textContent = "營業中";
  } else {
    hoursToggleLabel.textContent = `${DAY_NAMES[state.customDay]} ${fmtHM(state.customTime)}`;
  }
}

searchInput.addEventListener('input', e=>{
  state.q = e.target.value.trim().toLowerCase();
  render();
});

const searchBox = document.getElementById('searchBox');
const searchIconBtn = document.getElementById('searchIconBtn');
searchIconBtn.addEventListener('click', ()=>{
  if(searchBox.classList.contains('expanded')){
    if(searchInput.value.trim()===''){
      searchBox.classList.remove('expanded');
    }else{
      searchInput.focus();
    }
  }else{
    searchBox.classList.add('expanded');
    setTimeout(()=>searchInput.focus(), 80);
  }
});
searchInput.addEventListener('blur', ()=>{
  if(searchInput.value.trim()==='') searchBox.classList.remove('expanded');
});
searchInput.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    searchInput.value = '';
    state.q = '';
    render();
    searchBox.classList.remove('expanded');
    searchInput.blur();
  }
});

function currentCheckPoint(){
  if(state.rangeStart!==null){
    const day = state.customDay!==null ? state.customDay : (new Date().getDay()+6)%7;
    return {day, minutes: state.rangeStart};
  }
  if(state.customDay!==null && state.customTime!==null){
    return {day: state.customDay, minutes: state.customTime};
  }
  const now = new Date();
  return {day:(now.getDay()+6)%7, minutes: now.getHours()*60+now.getMinutes()};
}

function parkingBadge(r){
  const sub = r.parkingSub || '';
  switch(r.parkingTier){
    case 'lot': return { cls:'lot', label:`${sub}停車場` };
    case 'street': return { cls:'street', label:`${sub}路邊停車` };
    case 'none': return { cls:'none', label:'無停車位，建議搭車前往' };
    case 'walk': return { cls:'unknown', label:'步行／Uber 前往' };
    default: return { cls:'unknown', label:'停車資訊未提供' };
  }
}

function render(){
  const cp = currentCheckPoint();
  renderCatFilters(cp);
  const filtered = restaurants.filter(r=>{
    const areaOk = state.area==='all' || r.area===state.area;
    const catOk = state.cats.length===0 || state.cats.some(label=> catLabelMatches(r, label, true));
    const qOk = !state.q || (r.name+r.cat.join(' ')+r.desc+r.tags.join(' ')).toLowerCase().includes(state.q);
    const openOk = !state.onlyOpen || isOpenForFilter(r, cp);
    const favOk = !state.onlyFav || favorites.has(r.name);
    const sharedOk = !state.viewingShared || sharedFavorites.has(r.name);
    return areaOk && catOk && qOk && openOk && favOk && sharedOk;
  });

  const PRICE_RANK = {'$':1,'$$':2,'$$$':3,'$$$$':4};
  if(state.sort==='rating_desc') filtered.sort((a,b)=> b.rating - a.rating);
  else if(state.sort==='price_asc') filtered.sort((a,b)=> PRICE_RANK[a.price] - PRICE_RANK[b.price]);
  else if(state.sort==='price_desc') filtered.sort((a,b)=> PRICE_RANK[b.price] - PRICE_RANK[a.price]);
  else if(state.sort==='distance' && userLocation) filtered.sort((a,b)=>
    haversineKm(userLocation.lat, userLocation.lng, a.lat, a.lng) - haversineKm(userLocation.lat, userLocation.lng, b.lat, b.lng));

  const filterKey = JSON.stringify([state.area, state.cats, state.subCat, state.q, state.onlyOpen, state.onlyFav, state.sort, state.viewingShared, state.customDay, state.customTime, state.rangeStart, state.rangeEnd]);
  if(filterKey !== lastFilterKey){ visibleCount = PAGE_SIZE; lastFilterKey = filterKey; }

  resultCount.textContent = `共找到 ${filtered.length} 間餐廳`;
  grid.innerHTML = '';

  if(filtered.length===0){
    emptyState.style.display = 'block';
    emptyStateText.textContent = state.onlyFav
      ? '口袋名單還是空的，點卡片右上角的 ♥ 收藏喜歡的店家吧'
      : '找不到符合條件的餐廳，試試調整篩選條件';
    loadMoreWrap.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';

  const visible = filtered.slice(0, visibleCount);
  visible.forEach(r=>{
    const isMarket = r.cat.includes('夜市');
    const openNow = isOpenAt(r.name, cp.day, cp.minutes);
    const badgeClass = isMarket ? 'market' : (openNow ? 'open' : 'closed');
    const badgeText = isMarket ? '營業時間僅供參考' : (openNow ? '營業中' : '目前休息');
    const pk = parkingBadge(r);
    const photos = (r.photos && r.photos.length) ? r.photos : (r.photo ? [r.photo] : []);
    const fallbackDataUri = "data:image/svg+xml;utf8," + encodeURIComponent(catVisualSvg(r.cat[0]));
    const photoTrackHtml = photos.length
      ? photos.map(u=>`<img src="${u}" alt="${r.name}" loading="lazy" referrerpolicy="no-referrer">`).join('')
      : `<div class="card-photo-fallback">${catVisualSvg(r.cat[0])}</div>`;
    const photoDotsHtml = photos.length > 1
      ? `<div class="card-photo-dots">${photos.map((_,i)=>`<span class="dot${i===0?' active':''}"></span>`).join('')}</div>`
      : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photo">
        <div class="card-photo-track">${photoTrackHtml}</div>
        ${photoDotsHtml}
        <span class="card-open-badge ${badgeClass}"><span class="dot"></span>${badgeText}</span>
        <button class="card-fav-btn" type="button" aria-label="加入口袋名單" data-fav-btn></button>
        <span class="cat-label">${r.cat.join(' · ')}</span>
      </div>
      <div class="card-top">
        <div class="card-cats">${r.cat.map(c=>`<span>${c}</span>`).join('')}</div>
        <div class="card-name">${r.name}</div>
        ${r.nameZh ? `<div class="card-name-zh">${r.nameZh}</div>` : ''}
        <div class="card-area">${r.area}</div>
        <div class="card-rating"><span class="stars">★ ${r.rating.toFixed(1)}</span>${userLocation ? `<span class="distance">· 距離你 ${fmtDistance(haversineKm(userLocation.lat, userLocation.lng, r.lat, r.lng))}</span>` : ''}</div>
      </div>
      <div class="card-body">
        <div class="card-hours"><b>營業：</b>${hoursSummary(r.name)}${isMarket ? '（夜市攤況隨天氣、攤商調整，資料僅供參考）' : ''}</div>
        <div class="card-desc" style="font-size:13px;line-height:1.7;color:#4c473d;">${r.desc}</div>
        <div class="card-parking ${pk.cls}"><span class="icon">🅿️</span><span>${pk.label}</span></div>
        <div class="card-tags">${r.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
      <div class="card-foot">
        <span class="price">${r.price}</span>
        <div class="links">
          ${r.phone ? `<a href="tel:${r.phone.replace(/-/g,'')}">📞 致電</a>` : ''}
          <a href="${r.mapsUrl}" target="_blank" rel="noopener">📍 Google 地圖</a>
        </div>
      </div>
    `;
    const favBtn = card.querySelector('[data-fav-btn]');
    const isFav = favorites.has(r.name);
    favBtn.textContent = isFav ? '♥' : '♡';
    favBtn.classList.toggle('active', isFav);
    favBtn.addEventListener('click', ()=>{
      toggleFavorite(r.name);
      render();
    });
    const photoTrack = card.querySelector('.card-photo-track');
    if(photoTrack){
      photoTrack.querySelectorAll('img').forEach(img=>{
        img.addEventListener('error', ()=>{ img.onerror = null; img.src = fallbackDataUri; }, {once:true});
      });
    }
    const photoDots = card.querySelectorAll('.card-photo-dots .dot');
    if(photoTrack && photoDots.length){
      photoTrack.addEventListener('scroll', ()=>{
        const idx = Math.round(photoTrack.scrollLeft / photoTrack.clientWidth);
        photoDots.forEach((d,i)=>d.classList.toggle('active', i===idx));
      }, {passive:true});
    }
    grid.appendChild(card);
  });

  if(filtered.length > visible.length){
    loadMoreWrap.style.display = 'block';
    loadMoreBtn.textContent = `顯示更多（還有 ${filtered.length - visible.length} 間）`;
  } else {
    loadMoreWrap.style.display = 'none';
  }
}

// Purely rule-based (no external AI / API key involved): asks a few quick
// questions with tappable choices, then randomly picks one matching restaurant.
const pickerFab = document.getElementById('pickerFab');
const pickerPanel = document.getElementById('pickerPanel');
const pickerCloseBtn = document.getElementById('pickerCloseBtn');
const pickerBody = document.getElementById('pickerBody');

const PICKER_AREA_OPTIONS = [
  {label:'全部區域', value:'all'},
  {label:'新竹市', value:'新竹市'},
  {label:'竹北市', value:'竹北'},
  {label:'桃園', value:'桃園'},
];
const PICKER_CAT_OPTIONS = [
  {label:'都可以', value:'all'},
  ...Object.keys(CAT_GROUPS).map(c=>({label:c, value:c})),
];
const PICKER_PRICE_OPTIONS = [
  {label:'都可以', value:'all'},
  {label:'$ 平價', value:'$'},
  {label:'$$ 中價位', value:'$$'},
  {label:'$$$ 中高價位', value:'$$$'},
  {label:'$$$$ 高價位', value:'$$$$'},
];
const PICKER_OPEN_OPTIONS = [
  {label:'只要現在營業中', value:true},
  {label:'不限', value:false},
];

let pickerAnswers = {};

function pickerAddMessage(text){
  const el = document.createElement('div');
  el.className = 'picker-msg';
  el.textContent = text;
  pickerBody.appendChild(el);
  pickerBody.scrollTop = pickerBody.scrollHeight;
}
function pickerAddAnswer(text){
  const el = document.createElement('div');
  el.className = 'picker-answer';
  el.textContent = text;
  pickerBody.appendChild(el);
  pickerBody.scrollTop = pickerBody.scrollHeight;
}
function pickerAddChoices(options, onPick){
  const row = document.createElement('div');
  row.className = 'picker-choices';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = opt.label;
    btn.addEventListener('click', ()=>{
      row.querySelectorAll('button').forEach(b=>b.disabled = true);
      row.style.opacity = '0.5';
      pickerAddAnswer(opt.label);
      onPick(opt.value);
    });
    row.appendChild(btn);
  });
  pickerBody.appendChild(row);
  pickerBody.scrollTop = pickerBody.scrollHeight;
}

function pickerStart(){
  pickerBody.innerHTML = '';
  pickerAnswers = {};
  pickerAddMessage('嗨！幾個小問題幫你決定今天吃什麼 🍽️');
  pickerAskArea();
}
function pickerAskArea(){
  pickerAddMessage('想吃哪個區域？');
  pickerAddChoices(PICKER_AREA_OPTIONS, v=>{ pickerAnswers.area = v; pickerAskCat(); });
}
function pickerAskCat(){
  pickerAddMessage('想吃什麼類型？');
  pickerAddChoices(PICKER_CAT_OPTIONS, v=>{ pickerAnswers.cat = v; pickerAskPrice(); });
}
function pickerAskPrice(){
  pickerAddMessage('預算大概多少？');
  pickerAddChoices(PICKER_PRICE_OPTIONS, v=>{ pickerAnswers.price = v; pickerAskOpen(); });
}
function pickerAskOpen(){
  pickerAddMessage('要現在營業中的嗎？');
  pickerAddChoices(PICKER_OPEN_OPTIONS, v=>{ pickerAnswers.onlyOpen = v; pickerShowResult(); });
}

function pickerMatches(){
  const cp = currentCheckPoint();
  return restaurants.filter(r=>{
    const areaOk = pickerAnswers.area==='all' || r.area===pickerAnswers.area;
    const catOk = pickerAnswers.cat==='all' || catGroupMatches(r, pickerAnswers.cat);
    const priceOk = pickerAnswers.price==='all' || r.price===pickerAnswers.price;
    const openOk = !pickerAnswers.onlyOpen || isOpenForFilter(r, cp);
    return areaOk && catOk && priceOk && openOk;
  });
}

function pickerShowResult(){
  const matches = pickerMatches();
  if(matches.length === 0){
    pickerAddMessage('這個條件下找不到符合的餐廳，要不要放寬一點？');
    pickerAddChoices([{label:'🔁 重新開始', value:null}], ()=> pickerStart());
    return;
  }
  const pick = matches[Math.floor(Math.random() * matches.length)];
  pickerRenderResultCard(pick, matches);
}

function pickerRenderResultCard(r, matches){
  pickerAddMessage(`幫你抽到這家！（這個條件下共 ${matches.length} 間符合）`);
  const photos = (r.photos && r.photos.length) ? r.photos : (r.photo ? [r.photo] : []);
  const card = document.createElement('div');
  card.className = 'picker-result-card';
  card.innerHTML = `
    ${photos.length ? `<img src="${photos[0]}" alt="${r.name}" referrerpolicy="no-referrer" loading="lazy">` : ''}
    <div class="picker-result-body">
      <div class="picker-result-name">${r.name}</div>
      <div class="picker-result-meta">★ ${r.rating.toFixed(1)} · ${r.price} · ${r.area}</div>
      <div class="picker-result-meta">${r.desc}</div>
      <div class="picker-result-actions">
        <button type="button" id="pickerRedrawBtn">🔄 換一家</button>
        <a href="${r.mapsUrl}" target="_blank" rel="noopener">📍 地圖</a>
        <button type="button" class="primary" id="pickerRestartBtn">🔁 重新開始</button>
      </div>
    </div>
  `;
  pickerBody.appendChild(card);
  requestAnimationFrame(()=>{ pickerBody.scrollTop = pickerBody.scrollHeight; });
  card.querySelector('#pickerRedrawBtn').addEventListener('click', ()=>{
    card.remove();
    pickerShowResult();
  });
  card.querySelector('#pickerRestartBtn').addEventListener('click', ()=> pickerStart());
}

  state = freshState();
  areaUiExpanded = false;
  areaUiRegion = null;
  catUiExpanded = false;
  modeTabFood.classList.toggle('active', mode==='food');
  modeTabClothing.classList.toggle('active', mode==='clothing');
  recomputeCategoryLists();
  renderAreaToggle();
  render();
}

function enterBusanMode(){
  if(localMode === 'clothing') switchLocalMode('food');
  if(localRestaurants === null) localRestaurants = restaurants;
  restaurants = busanRestaurants;
  AREA_REGIONS = AREA_REGIONS_BUSAN;
  state = freshState();
  areaUiExpanded = false;
  areaUiRegion = null;
  siteMode = 'busan';
  document.body.classList.add('busan-mode');
  tripToggleLabel.textContent = '回在地版';
  tripToggleBtn.classList.add('active');
  tripPicker.style.display = 'none';
  modeTabs.style.display = 'none';
  recomputeCategoryLists();
  renderAreaToggle();
  render();
}

function exitBusanMode(){
  restaurants = localRestaurants;
  AREA_REGIONS = AREA_REGIONS_TAIWAN;
  state = freshState();
  areaUiExpanded = false;
  areaUiRegion = null;
  siteMode = 'local';
  modeTabs.style.display = CLOTHING_ENTRY_ENABLED ? 'flex' : 'none';
  document.body.classList.remove('busan-mode');
  tripToggleLabel.textContent = '旅遊版';
  tripToggleBtn.classList.remove('active');
  recomputeCategoryLists();
  renderAreaToggle();
  render();
}

function renderTripCountryRow(){
  tripCountryRow.innerHTML = '';
  TRIP_COUNTRIES.forEach(c=>{
    const btn = document.createElement('button');
    btn.textContent = c.label;
    if(!c.enabled){
      btn.className = 'area-future';
      btn.disabled = true;
      btn.title = '尚未開放';
    } else {
      btn.addEventListener('click', ()=>{
        renderTripCityRow(c);
        tripCityWrap.style.display = 'block';
      });
    }
    tripCountryRow.appendChild(btn);
  });
}

function renderTripCityRow(country){
  tripCityRow.innerHTML = '';
  country.cities.forEach(city=>{
    const btn = document.createElement('button');
    btn.textContent = city.label;
    if(!city.enabled){
      btn.className = 'area-future';
      btn.disabled = true;
      btn.title = '尚未開放';
    } else {
      btn.addEventListener('click', enterBusanMode);
    }
    tripCityRow.appendChild(btn);
  });
}

const TRIP_COUNTRIES = [
  {code:'KR', label:'韓國', enabled:true, cities:[
    {code:'busan', label:'釜山', enabled:true},
    {code:'seoul', label:'首爾', enabled:false},
    {code:'jeju', label:'濟州', enabled:false},
  ]},
  {code:'JP', label:'日本', enabled:false, cities:[]},
  {code:'other', label:'其他', enabled:false, cities:[]},
];

modeTabFood.addEventListener('click', ()=>{ if(CLOTHING_ENTRY_ENABLED && siteMode!=='busan') switchLocalMode('food'); });
modeTabClothing.addEventListener('click', ()=>{ if(CLOTHING_ENTRY_ENABLED && siteMode!=='busan') switchLocalMode('clothing'); });

tripToggleBtn.addEventListener('click', ()=>{
  if(siteMode==='busan'){ exitBusanMode(); return; }
  const opening = tripPicker.style.display==='none';
  tripPicker.style.display = opening ? 'flex' : 'none';
  tripPicker.style.flexDirection = 'column';
  if(opening){
    renderTripCountryRow();
    tripCityWrap.style.display = 'none';
  }
});


pickerFab.addEventListener('click', ()=>{
  pickerPanel.classList.add('open');
  pickerFab.classList.add('hide');
  if(!pickerBody.children.length) pickerStart();
});
pickerCloseBtn.addEventListener('click', ()=>{
  pickerPanel.classList.remove('open');
  pickerFab.classList.remove('hide');
});

(async function initializeApp(){
  buildTimeSelectors();
  updateFavCount();
  render();
  tryAutoLocate();
  try{
    if(window.SUPABASE_CONFIG?.url && window.SUPABASE_CONFIG?.anonKey){
      await loadRestaurantsFromSupabase();
      await initAuth();
    }else{
      restaurants = embeddedRestaurants;
    }
  }catch(error){
    console.warn(error);
    restaurants = embeddedRestaurants;
    showToast('資料庫暫時無法連線，已使用離線餐廳資料');
  }
  recomputeCategoryLists();
  initSharedList();
  render();
})();
</script>
