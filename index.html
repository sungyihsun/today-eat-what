<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今天吃什麼 — 新竹市 × 竹北市 餐廳地圖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --ink:#1b1a17;
    --paper:#f5f1e8;
    --paper2:#ece4d3;
    --seal:#b5453a;
    --gold:#d9861f;
    --jade:#3c5a4b;
    --line:#e4dcc9;
    --white:#fffdfa;
    --card-radius:22px;
    --pill-radius:999px;
    --shadow-sm:0 1px 2px rgba(27,26,23,0.05), 0 1px 1px rgba(27,26,23,0.04);
    --shadow-md:0 8px 24px rgba(27,26,23,0.08), 0 2px 6px rgba(27,26,23,0.05);
    --shadow-lg:0 16px 40px rgba(27,26,23,0.14), 0 4px 10px rgba(27,26,23,0.06);
    --safe-l:max(6vw, env(safe-area-inset-left));
    --safe-r:max(6vw, env(safe-area-inset-right));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,134,59,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(181,69,58,0.04), transparent 45%);
  }
  ::selection{ background:var(--seal); color:var(--white); }
  img{ display:block; }
  button, select, input{ font:inherit; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  header{
    position:relative;
    padding:52px var(--safe-r) 36px var(--safe-l);
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:14px;
    color:var(--seal);
    letter-spacing:2.5px;
    margin-bottom:10px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(36px,6.5vw,72px);
    line-height:1.05;
    letter-spacing:0.5px;
  }
  h1 .accent{ color:var(--seal); }
  .subhead{
    margin-top:14px;
    max-width:560px;
    font-size:15px;
    line-height:1.8;
    color:#5a5548;
  }
  .stamp{
    position:absolute;
    top:50px; right:var(--safe-r);
    width:88px; height:88px;
    border-radius:50%;
    background:linear-gradient(155deg, var(--seal), #8f342b);
    box-shadow:var(--shadow-md);
    display:flex; align-items:center; justify-content:center;
    color:var(--white);
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:13px;
    line-height:1.35;
    text-align:center;
    letter-spacing:1px;
  }
  @media (max-width:760px){ .stamp{ display:none; } }

  .controls{
    position:sticky; top:0; z-index:30;
    background:rgba(245,241,232,0.62);
    backdrop-filter:blur(24px) saturate(1.8);
    -webkit-backdrop-filter:blur(24px) saturate(1.8);
    border-bottom:1px solid rgba(255,255,255,0.5);
    box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 8px 20px rgba(27,26,23,0.04);
    padding:14px var(--safe-r) 14px var(--safe-l);
  }
  .search-box{
    position:relative; display:flex; align-items:center;
    height:38px; border-radius:999px; flex:0 0 auto;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.32);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    width:38px; overflow:hidden;
    transition:width .25s cubic-bezier(.4,0,.2,1), background .2s ease, box-shadow .2s ease;
  }
  .search-box.expanded{ width:min(260px, 62vw); background:rgba(255,255,255,0.75); box-shadow:0 0 0 3px rgba(181,69,58,0.16), var(--shadow-sm); }
  .search-icon-btn{
    width:38px; height:38px; flex:0 0 auto; border:none; background:transparent; padding:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#5a5548;
  }
  .search-box input{
    border:none; background:transparent; outline:none;
    height:36px; width:0; min-width:0; padding:0; opacity:0;
    font-size:16px; flex:1 1 auto;
    transition:opacity .18s ease, width .25s ease, padding .25s ease;
  }
  .search-box.expanded input{ width:100%; opacity:1; padding:0 14px 0 0; }
  .search-box input::placeholder{ color:#8a8474; }

  .filter-row{
    display:flex; gap:9px; align-items:center; flex-wrap:wrap;
  }
  .filter-row-2{
    margin-top:9px;
  }

  /* Horizontally scrollable chip strip of area/city buttons, frosted glass */
  .area-toggle{
    display:flex; gap:6px; align-items:center; flex:0 0 auto; max-width:100%;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .area-toggle::-webkit-scrollbar{ display:none; }
  .area-toggle button{
    flex:0 0 auto;
    padding:8px 15px; height:38px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.28);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    font-weight:600; font-size:13.5px;
    cursor:pointer; color:#5a5548; transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .area-toggle button.active{ background:rgba(255,255,255,0.85); color:var(--ink); box-shadow:var(--shadow-sm); font-weight:700; }
  .area-toggle button.area-future{
    background:rgba(60,55,48,0.05); border-color:rgba(60,55,48,0.08);
    color:#b3ada0; cursor:not-allowed; font-weight:500;
  }

  .hours-icon-btn, .fav-toggle{
    display:flex; align-items:center; gap:7px;
    height:38px; padding:0 15px;
    border:1px solid rgba(255,255,255,0.5);
    border-radius:999px;
    background:rgba(60,90,75,0.12);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--jade);
    flex:0 0 auto;
    user-select:none;
    transition:background .2s ease, color .2s ease;
  }
  .hours-icon-btn.active{ background:rgba(60,90,75,0.88); color:var(--white); }
  .hours-icon-btn svg{ flex:0 0 auto; display:block; }

  .fav-toggle{ background:rgba(181,69,58,0.12); color:var(--seal); }
  .fav-toggle.active{ background:rgba(181,69,58,0.88); color:var(--white); }
  .fav-toggle .count{
    font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px;
    background:rgba(181,69,58,0.16); color:var(--seal);
  }
  .fav-toggle.active .count{ background:rgba(255,255,255,0.25); color:var(--white); }

  .share-btn{
    height:38px; padding:0 15px; border:1px solid rgba(255,255,255,0.5); border-radius:999px;
    background:rgba(255,255,255,0.32); backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    cursor:pointer; font-size:13.5px; font-weight:600;
    color:var(--ink); flex:0 0 auto; transition:background .2s ease;
  }
  .share-btn:hover{ background:rgba(255,255,255,0.55); }

  .shared-banner{
    margin:0 var(--safe-r) 0 var(--safe-l);
    margin-top:-1px;
    background:rgba(60,90,75,0.82); color:var(--white);
    backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    padding:14px 18px; border-radius:0 0 16px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    font-size:13.5px; font-weight:500;
    box-shadow:var(--shadow-md);
  }
  .shared-banner-actions{ display:flex; gap:10px; flex:0 0 auto; }
  .shared-banner-actions button{
    padding:8px 14px; border-radius:999px; border:1.5px solid rgba(255,255,255,0.7);
    background:transparent; color:var(--white); font-weight:700; font-size:12.5px; cursor:pointer;
    min-height:36px;
  }
  .shared-banner-actions button:hover{ background:rgba(255,255,255,0.18); }
  #sharedAdoptBtn{ background:rgba(255,255,255,0.9); color:var(--jade); border-color:rgba(255,255,255,0.9); }
  #sharedAdoptBtn:hover{ background:rgba(255,255,255,0.75); }

  .toast{
    position:fixed; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px) scale(0.95);
    background:rgba(27,26,23,0.72); backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
    color:var(--paper); padding:12px 22px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.12);
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .25s cubic-bezier(.4,0,.2,1), transform .25s cubic-bezier(.4,0,.2,1); z-index:50;
    box-shadow:var(--shadow-lg); max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }

  .time-select-row{
    display:none;
    gap:10px; align-items:center; flex-wrap:wrap;
    margin-top:12px;
    font-size:13px; color:#5a5548;
  }
  .time-select-row.visible{ display:flex; }
  .time-select-row select{
    height:38px; padding:0 10px; border:1px solid rgba(255,255,255,0.5); border-radius:10px;
    background:rgba(255,255,255,0.35); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    font-size:14px;
  }

  .cat-select-wrap{
    position:relative; flex:0 0 auto;
    display:flex; align-items:center;
  }
  .cat-select-wrap::after{
    content:"";
    position:absolute; right:15px; top:50%; width:7px; height:7px;
    border-right:2px solid #8a8474; border-bottom:2px solid #8a8474;
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .cat-select{
    appearance:none; -webkit-appearance:none;
    height:38px;
    padding:0 34px 0 16px;
    border:1px solid rgba(255,255,255,0.5); border-radius:999px;
    background:rgba(255,255,255,0.32); color:var(--ink);
    backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
    font-weight:600; font-size:13.5px;
    cursor:pointer; max-width:46vw;
  }
  .cat-select:focus{ outline:none; box-shadow:0 0 0 3px rgba(217,134,31,0.25); }

  .result-count{ margin-top:12px; font-size:12.5px; color:#8a8474; }

  /* Horizontal chip-scroll strip on phones — classic iOS filter-bar pattern */
  @media (max-width:720px){
    .filter-row{
      flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x proximity;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
      margin:0 calc(-1 * var(--safe-l)) 0 calc(-1 * var(--safe-l));
      padding:2px var(--safe-l) 6px;
    }
    .filter-row::-webkit-scrollbar{ display:none; }
    .filter-row > *{ scroll-snap-align:start; }
    .cat-select{ max-width:56vw; }
  }

  main{ padding:32px var(--safe-r) 100px var(--safe-l); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
  .card{
    background:rgba(255,253,250,0.78); border:1px solid rgba(255,255,255,0.6); border-radius:var(--card-radius);
    backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5);
    overflow:hidden; display:flex; flex-direction:column; position:relative;
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.6);
    transition:transform .28s cubic-bezier(.34,1.3,.64,1), box-shadow .28s ease;
  }
  .card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
  .card:active{ transform:translateY(-1px) scale(0.994); }

  .card-photo{
    position:relative; width:100%; height:160px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper2);
  }
  .card-photo svg{ width:100%; height:100%; }
  .card-photo-track{
    display:flex; width:100%; height:100%;
    overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .card-photo-track::-webkit-scrollbar{ display:none; }
  .card-photo-track img{ flex:0 0 100%; width:100%; height:100%; object-fit:cover; scroll-snap-align:start; }
  .card-photo-fallback{ flex:0 0 100%; width:100%; height:100%; }
  .card-photo-fallback svg{ width:100%; height:100%; display:block; }
  .card-photo-dots{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:5px; z-index:2; pointer-events:none;
  }
  .card-photo-dots .dot{
    width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.5);
    box-shadow:0 0 2px rgba(0,0,0,0.3);
    transition:background .2s ease, transform .2s ease;
  }
  .card-photo-dots .dot.active{ background:#fff; transform:scale(1.3); }
  .card-photo .cat-label{
    position:absolute; bottom:10px; left:14px;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:12.5px;
    color:rgba(255,255,255,0.94); text-shadow:0 1px 4px rgba(0,0,0,0.45);
  }
  .card-open-badge{
    position:absolute; top:10px; left:10px;
    font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px;
    display:flex; align-items:center; gap:5px;
    backdrop-filter:blur(6px);
  }
  .card-open-badge.open{ background:rgba(228,244,232,0.92); color:#2c6b41; }
  .card-open-badge.closed{ background:rgba(246,227,225,0.92); color:#a7332a; }
  .card-open-badge.market{ background:rgba(255,255,255,0.92); color:#6b6656; }
  .card-open-badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .card-fav-btn{
    position:absolute; top:8px; right:8px;
    width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(27,26,23,0.4); backdrop-filter:blur(8px); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer; transition:background .15s ease, transform .15s cubic-bezier(.34,1.3,.64,1);
  }
  .card-fav-btn:hover{ background:rgba(27,26,23,0.6); }
  .card-fav-btn:active{ transform:scale(0.88); }
  .card-fav-btn.active{ background:var(--seal); transform:scale(1.05); }

  .card-top{ padding:16px 18px 12px; position:relative; }
  .card-cats{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .card-cats span{
    font-size:10.5px; font-weight:700; letter-spacing:.3px;
    padding:4px 10px; border-radius:999px; background:rgba(217,134,31,0.14); color:#95590f;
  }
  .card-name{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:18.5px; line-height:1.35;
    margin-bottom:7px;
  }
  .card-area{
    display:inline-block; font-size:11.5px; font-weight:700; color:var(--jade);
    background:rgba(60,90,75,0.1); border-radius:999px; padding:3px 10px; margin-bottom:8px;
  }
  .card-rating{ display:flex; align-items:center; gap:6px; font-size:13px; color:#59544a; flex-wrap:wrap; }
  .card-rating .stars{ color:var(--gold); font-weight:700; }
  .card-rating .distance{ color:#8a8474; font-weight:500; }

  .card-body{ padding:2px 18px 16px; flex:1; display:flex; flex-direction:column; gap:10px; }
  .card-hours{ font-size:12.5px; color:#4c473d; display:flex; align-items:baseline; gap:6px; }
  .card-hours b{ color:var(--ink); font-weight:700; white-space:nowrap; flex-shrink:0; }
  .card-parking{
    font-size:12px; line-height:1.4;
    display:flex; gap:7px; align-items:center;
    border-radius:10px; padding:8px 11px;
    font-weight:700;
  }
  .card-parking .icon{ flex:0 0 auto; }
  .card-parking .sub{ font-weight:500; opacity:.8; margin-left:2px; }
  .card-parking.lot{ background:#e4f4e8; color:#2c6b41; }
  .card-parking.street{ background:#fbf1dc; color:#8a6a1f; }
  .card-parking.none{ background:#f6e3e1; color:#a7332a; }
  .card-parking.unknown{ background:var(--paper); color:#8a8474; font-weight:500; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
  .card-tags span{
    font-size:10.5px; padding:3px 9px; border-radius:999px;
    background:var(--paper); color:#6b6656;
  }
  .card-foot{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 18px; border-top:1px solid var(--line); font-size:12.5px;
  }
  .card-foot .price{ font-weight:700; color:var(--seal); letter-spacing:0.5px; }
  .card-foot .links{ display:flex; gap:16px; }
  .card-foot a{
    color:var(--ink); text-decoration:none; font-weight:600;
    display:flex; align-items:center; gap:4px;
  }

  .empty-state{ text-align:center; padding:80px 20px; color:#8a8474; }
  .empty-state .kanji{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:52px; color:var(--seal); margin-bottom:10px; display:block;
  }

  footer{
    padding:32px var(--safe-r) max(32px, env(safe-area-inset-bottom)) var(--safe-l);
    border-top:1px solid var(--line);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
    font-size:12px; color:#8a8474;
  }
  footer a{ color:#8a8474; }

  @media (max-width:520px){
    header{ padding:40px 5vw 30px; }
    .grid{ grid-template-columns:1fr; gap:16px; }
    .card-name{ font-size:18px; }
    footer{ flex-direction:column; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">選擇困難救星</div>
  <h1>今天吃什麼<span class="accent">？</span></h1>
  <p class="subhead">收錄上百間口袋餐廳，依分類挑選、看現正營業，選擇困難不再煩惱吃什麼。</p>
  <div class="stamp">今天<br>吃<br>什麼</div>
</header>

<div class="controls">
  <div class="filter-row">
    <div class="search-box" id="searchBox">
      <button class="search-icon-btn" id="searchIconBtn" type="button" aria-label="搜尋">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <input id="searchInput" type="text" placeholder="搜尋店名、菜系或關鍵字…">
    </div>
    <div class="area-toggle" id="areaToggle">
      <button data-area="all" class="active">全部區域</button>
      <button data-area="新竹市">新竹市</button>
      <button data-area="竹北">竹北市</button>
      <button class="area-future" disabled title="即將推出">台北</button>
      <button class="area-future" disabled title="即將推出">新北</button>
      <button class="area-future" disabled title="即將推出">桃園</button>
      <button class="area-future" disabled title="即將推出">台中</button>
      <button class="area-future" disabled title="即將推出">台南</button>
      <button class="area-future" disabled title="即將推出">高雄</button>
    </div>
    <div class="fav-toggle" id="favToggle">
      <span>♥ 我的口袋名單</span>
      <span class="count" id="favCount">0</span>
    </div>
    <button class="share-btn" id="shareBtn" type="button" title="分享我的口袋名單">🔗 分享</button>
  </div>
  <div class="filter-row filter-row-2">
    <div class="cat-select-wrap">
      <select class="cat-select" id="catSelect" aria-label="依分類篩選"></select>
    </div>
    <div class="cat-select-wrap" id="subCatSelectWrap" style="display:none;">
      <select class="cat-select" id="subCatSelect" aria-label="依細分類篩選"></select>
    </div>
    <button class="hours-icon-btn" id="hoursToggle" type="button" aria-label="依時間篩選" title="依時間篩選">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span id="hoursToggleLabel">時間</span>
    </button>
  </div>
  <div class="time-select-row" id="timeSelectRow">
    指定時間查詢：
    <select id="daySelect"></select>
    <select id="timeSelect"></select>
    <button id="clearTimeBtn" style="border:none;background:none;text-decoration:underline;cursor:pointer;color:var(--seal);font-size:13px;">清除，改用現在時間</button>
  </div>

function fmtHM(min){
  const h = Math.floor((min%1440)/60);
  const m = min%60;
  const ampm = h<12 ? "上午" : "下午";
  let h12 = h%12; if(h12===0) h12=12;
  return `${ampm}${h12}:${String(m).padStart(2,'0')}`;
}

function hoursSummary(name){
  const week = HOURS[name];
  if(!week) return "營業時間請洽店家";
  const today = (new Date().getDay()+6)%7;
  const ranges = week[today];
  if(!ranges || ranges.length===0) return `${DAY_NAMES[today]}公休`;
  return `${DAY_NAMES[today]} ` + ranges.map(r=>`${fmtHM(r[0])}–${fmtHM(r[1])}`).join('、');
}

function isOpenAt(name, dayIdx, minutes){
  const week = HOURS[name];
  if(!week) return null;
  const check = (d, absMin) => {
    const ranges = week[((d%7)+7)%7];
    return ranges.some(r => absMin >= (d*1440+r[0]) && absMin < (d*1440+r[1]));
  };
  const abs = dayIdx*1440 + minutes;
  if(check(dayIdx, abs)) return true;
  if(check(dayIdx-1, abs)) return true;
  if(check(dayIdx+7, abs+10080)) return true;
  return false;
}

// 口袋名單／我的最愛：存在瀏覽器 localStorage，不用登入，只有這台裝置這個瀏覽器看得到
const FAV_KEY = 'zhushitu_favorites';
function loadFavorites(){
  try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveFavorites(set){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }
  catch(e){ /* localStorage unavailable (private mode etc.) — favorites just won't persist */ }
}
let favorites = loadFavorites();
function toggleFavorite(name){
  if(favorites.has(name)) favorites.delete(name); else favorites.add(name);
  saveFavorites(favorites);
  updateFavCount();
}
function updateFavCount(){
  favCount.textContent = favorites.size;
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove('show'), 2600);
}

// 分享口袋名單：把目前收藏的店名編碼進網址的 ?fav= 參數，複製連結給別人
shareBtn.addEventListener('click', async ()=>{
  if(favorites.size === 0){
    showToast('口袋名單是空的，先收藏幾家店再分享吧');
    return;
  }
  const encoded = encodeURIComponent(JSON.stringify([...favorites]));
  const url = `${location.origin}${location.pathname}?fav=${encoded}`;
  try{
    await navigator.clipboard.writeText(url);
    showToast(`已複製分享連結（${favorites.size} 家店）`);
  }catch(e){
    window.prompt('複製這個連結分享給朋友：', url);
  }
});

function initSharedList(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('fav');
  if(!raw) return;
  let names;
  try{ names = JSON.parse(decodeURIComponent(raw)); }
  catch(e){ return; }
  if(!Array.isArray(names) || names.length === 0) return;
  const validNames = names.filter(n => restaurants.some(r => r.name === n));
  if(validNames.length === 0) return;

// Coarse cuisine/type buckets shown in the filter dropdown. Each restaurant keeps its
// full detailed cat[] (still shown on the card itself) — this mapping just groups those
// detailed strings under short labels so the dropdown stays a short, scannable list.
const CAT_GROUPS = {
  '台式': ['台式/客家合菜'],
  '義式': ['義式料理'],
  '日式': ['日式料理'],
  '韓式': ['韓式料理'],
  '泰式': ['泰式料理'],
  '港式': ['港式料理'],
  '小吃': ['麵食/小吃'],
  '吃到飽': ['吃到飽'],
  '夜市': ['夜市'],
};
// A second cascading tier: once a top-level category is picked, the sub-select
// only lists these types that actually apply to restaurants within that pick.
const SUB_CAT_GROUPS = {
  '火鍋': ['火鍋/鍋物'],
  '燒烤': ['燒烤'],
  '牛排': ['牛排'],
  '熱炒/居酒屋': ['熱炒/居酒屋'],
  '咖啡/甜點': ['咖啡廳', '甜點/烘焙'],
  '早餐/早午餐': ['早餐店', '早午餐'],
  '炸雞/鹹酥雞': ['炸雞/鹹酥雞'],
  '酒吧': ['酒吧/Bar'],
  '素食': ['素食/蔬食'],
};
const ALL_CAT_GROUPS = Object.assign({}, CAT_GROUPS, SUB_CAT_GROUPS);
function hasAnyMatch(label){
  return ALL_CAT_GROUPS[label].some(c => restaurants.some(r => r.cat.includes(c)));
}
const PRIMARY_CATEGORIES = Object.keys(CAT_GROUPS).filter(hasAnyMatch);
const SUB_CATEGORIES = Object.keys(SUB_CAT_GROUPS).filter(hasAnyMatch);
function catGroupMatches(r, label){
  return ALL_CAT_GROUPS[label].some(c => r.cat.includes(c));
}

// A restaurant can belong to several categories at once (e.g. a hotpot buffet
// is both "火鍋/鍋物" and "吃到飽") — r.cat is always an array.
// Does restaurant r pass every active structural filter except the one named in `exclude`?
// Used to figure out which dropdown options would still yield results.
function matchesStructural(r, cp, exclude){
  const areaOk = state.area==='all' || r.area===state.area;
  const catOk = exclude==='cat' || state.cat==='all' || catGroupMatches(r, state.cat);
  const subCatOk = exclude==='subCat' || state.subCat==='all' || catGroupMatches(r, state.subCat);
  const openOk = !state.onlyOpen || r.cat.includes('夜市') || isOpenAt(r.name, cp.day, cp.minutes)===true;
  return areaOk && catOk && subCatOk && openOk;
}

function availableGroups(cp, exclude, labels){
  const set = new Set();
  restaurants.forEach(r=>{
    if(!matchesStructural(r, cp, exclude)) return;
    labels.forEach(label=>{ if(catGroupMatches(r, label)) set.add(label); });
  });
  return set;
}

// Rebuild the category dropdowns so only options with at least one matching
// restaurant are selectable — never lets the user pick a dead-end combo.
// The sub-category select only appears once a top-level category is chosen,
// and only lists sub-types that actually occur within that top-level pick.
function syncSelects(cp){
  const availCats = availableGroups(cp, 'cat', PRIMARY_CATEGORIES);
  if(state.cat!=='all' && !availCats.has(state.cat)) state.cat = 'all';

  catSelect.innerHTML = '';
  const catAllOpt = document.createElement('option');
  catAllOpt.value='all'; catAllOpt.textContent='全部分類';
  catSelect.appendChild(catAllOpt);
  const makeOpt = (c, avail) => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.disabled = !avail.has(c);
    opt.textContent = c + (avail.has(c) ? '' : '（此條件下無結果）');
    return opt;
  };
  PRIMARY_CATEGORIES.forEach(c=> catSelect.appendChild(makeOpt(c, availCats)));
  catSelect.value = state.cat;

  const availSubCats = state.cat==='all' ? new Set() : availableGroups(cp, 'subCat', SUB_CATEGORIES);
  if(state.subCat!=='all' && !availSubCats.has(state.subCat)) state.subCat = 'all';

  if(availSubCats.size === 0){
    subCatSelectWrap.style.display = 'none';
  } else {
    subCatSelectWrap.style.display = '';
    subCatSelect.innerHTML = '';
    const subAllOpt = document.createElement('option');
    subAllOpt.value='all'; subAllOpt.textContent='全部細分類';
    subCatSelect.appendChild(subAllOpt);
    SUB_CATEGORIES.filter(c=>availSubCats.has(c)).forEach(c=> subCatSelect.appendChild(makeOpt(c, availSubCats)));
    subCatSelect.value = state.subCat;
  }
}

function buildTimeSelectors(){
  DAY_NAMES.forEach((d,i)=>{
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = d;
    daySelect.appendChild(opt);
  });
  for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=30){
      const opt = document.createElement('option');
      const val = h*60+m;
      opt.value = val;
      opt.textContent = fmtHM(val);
      timeSelect.appendChild(opt);
    }
  }
  const now = new Date();
  daySelect.value = (now.getDay()+6)%7;
  const nowMin = now.getHours()*60+now.getMinutes();
  timeSelect.value = Math.round(nowMin/30)*30 % 1440;
}

// 兩點球面距離（公里），用來做「距離：近到遠」排序
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDistance(km){
  return km < 1 ? `${Math.round(km*1000)} 公尺` : `${km.toFixed(1)} 公里`;
}

function currentCheckPoint(){
  if(state.customDay!==null && state.customTime!==null){
    return {day: state.customDay, minutes: state.customTime};
  }
  const now = new Date();
  return {day:(now.getDay()+6)%7, minutes: now.getHours()*60+now.getMinutes()};
}

function parkingBadge(r){
  const sub = r.parkingSub || '';
  switch(r.parkingTier){
    case 'lot': return { cls:'lot', label:`${sub}停車場` };
    case 'street': return { cls:'street', label:`${sub}路邊停車` };
    case 'none': return { cls:'none', label:'無停車位，建議搭車前往' };
    default: return { cls:'unknown', label:'停車資訊未提供' };
  }
}

function render(){
  const cp = currentCheckPoint();
  syncSelects(cp);
  const filtered = restaurants.filter(r=>{
    const areaOk = state.area==='all' || r.area===state.area;
    const catOk = state.cat==='all' || catGroupMatches(r, state.cat);
    const subCatOk = state.subCat==='all' || catGroupMatches(r, state.subCat);
    const qOk = !state.q || (r.name+r.cat.join(' ')+r.desc+r.tags.join(' ')).toLowerCase().includes(state.q);
    const openOk = !state.onlyOpen || r.cat.includes('夜市') || isOpenAt(r.name, cp.day, cp.minutes)===true;
    const favOk = !state.onlyFav || favorites.has(r.name);
    const sharedOk = !state.viewingShared || sharedFavorites.has(r.name);
    return areaOk && catOk && subCatOk && qOk && openOk && favOk && sharedOk;
  });

  if(state.sort==='distance' && userLocation) filtered.sort((a,b)=>
    haversineKm(userLocation.lat, userLocation.lng, a.lat, a.lng) - haversineKm(userLocation.lat, userLocation.lng, b.lat, b.lng));

  resultCount.textContent = `共找到 ${filtered.length} 間餐廳`;
  grid.innerHTML = '';

  if(filtered.length===0){
    emptyState.style.display = 'block';
    emptyStateText.textContent = state.onlyFav
      ? '口袋名單還是空的，點卡片右上角的 ♥ 收藏喜歡的店家吧'
      : '找不到符合條件的餐廳，試試調整篩選條件';
    return;
  }
  emptyState.style.display = 'none';

  filtered.forEach(r=>{
    const isMarket = r.cat.includes('夜市');
    const openNow = isOpenAt(r.name, cp.day, cp.minutes);
    const badgeClass = isMarket ? 'market' : (openNow ? 'open' : 'closed');
    const badgeText = isMarket ? '營業時間僅供參考' : (openNow ? '營業中' : '目前休息');
    const pk = parkingBadge(r);
    const photos = (r.photos && r.photos.length) ? r.photos : (r.photo ? [r.photo] : []);
    const fallbackDataUri = "data:image/svg+xml;utf8," + encodeURIComponent(catVisualSvg(r.cat[0]));
    const photoTrackHtml = photos.length
      ? photos.map(u=>`<img src="${u}" alt="${r.name}" loading="lazy" referrerpolicy="no-referrer">`).join('')
      : `<div class="card-photo-fallback">${catVisualSvg(r.cat[0])}</div>`;
    const photoDotsHtml = photos.length > 1
      ? `<div class="card-photo-dots">${photos.map((_,i)=>`<span class="dot${i===0?' active':''}"></span>`).join('')}</div>`
      : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photo">
        <div class="card-photo-track">${photoTrackHtml}</div>
        ${photoDotsHtml}
        <span class="card-open-badge ${badgeClass}"><span class="dot"></span>${badgeText}</span>
        <button class="card-fav-btn" type="button" aria-label="加入口袋名單" data-fav-btn></button>
        <span class="cat-label">${r.cat.join(' · ')}</span>
      </div>
      <div class="card-top">
        <div class="card-cats">${r.cat.map(c=>`<span>${c}</span>`).join('')}</div>
        <div class="card-name">${r.name}</div>
        <div class="card-area">${r.area}</div>
        <div class="card-rating"><span class="stars">★ ${r.rating.toFixed(1)}</span>${userLocation ? `<span class="distance">· 距離你 ${fmtDistance(haversineKm(userLocation.lat, userLocation.lng, r.lat, r.lng))}</span>` : ''}</div>
      </div>
      <div class="card-body">
        <div class="card-hours"><b>營業：</b>${hoursSummary(r.name)}${isMarket ? '（夜市攤況隨天氣、攤商調整，資料僅供參考）' : ''}</div>
        <div class="card-desc" style="font-size:13px;line-height:1.7;color:#4c473d;">${r.desc}</div>
        <div class="card-parking ${pk.cls}"><span class="icon">🅿️</span><span>${pk.label}</span></div>
        <div class="card-tags">${r.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
      <div class="card-foot">
        <span class="price">${r.price}</span>
        <div class="links">
          ${r.phone ? `<a href="tel:${r.phone.replace(/-/g,'')}">📞 致電</a>` : ''}
          <a href="${r.mapsUrl}" target="_blank" rel="noopener">📍 Google 地圖</a>
        </div>
      </div>
    `;
    const favBtn = card.querySelector('[data-fav-btn]');
    const isFav = favorites.has(r.name);
    favBtn.textContent = isFav ? '♥' : '♡';
    favBtn.classList.toggle('active', isFav);
    favBtn.addEventListener('click', ()=>{
      toggleFavorite(r.name);
      render();
    });
    const photoTrack = card.querySelector('.card-photo-track');
    if(photoTrack){
      photoTrack.querySelectorAll('img').forEach(img=>{
        img.addEventListener('error', ()=>{ img.onerror = null; img.src = fallbackDataUri; }, {once:true});
      });
    }
    const photoDots = card.querySelectorAll('.card-photo-dots .dot');
    if(photoTrack && photoDots.length){
      photoTrack.addEventListener('scroll', ()=>{
        const idx = Math.round(photoTrack.scrollLeft / photoTrack.clientWidth);
        photoDots.forEach((d,i)=>d.classList.toggle('active', i===idx));
      }, {passive:true});
    }
    grid.appendChild(card);
  });
}

buildTimeSelectors();
updateFavCount();
initSharedList();
render();
</script>

</body>
</html>
