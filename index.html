<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹食圖 — 新竹市 × 竹北 餐廳地圖</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Zhi+Mang+Xing&display=swap');

  :root{
    --ink:#1b1a17;
    --paper:#f2ede1;
    --paper2:#e9e1cf;
    --seal:#a7332a;
    --gold:#b8863b;
    --jade:#3c5a4b;
    --line:#c9bfa4;
    --white:#fffdf8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,134,59,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(167,51,42,0.05), transparent 45%);
  }
  ::selection{ background:var(--seal); color:var(--white); }
  img{ display:block; }

  header{
    position:relative;
    padding:56px 6vw 40px;
    overflow:hidden;
    border-bottom:3px solid var(--ink);
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(27,26,23,0.025) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Zhi Mang Xing', cursive;
    font-size:22px;
    color:var(--seal);
    letter-spacing:2px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(38px,6.5vw,76px);
    line-height:1.02;
    letter-spacing:1px;
  }
  h1 .accent{ color:var(--seal); }
  .subhead{
    margin-top:16px;
    max-width:560px;
    font-size:15.5px;
    line-height:1.85;
    color:#4a463d;
  }
  .stamp{
    position:absolute;
    top:52px; right:6vw;
    width:92px; height:92px;
    border:3px solid var(--seal);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(6deg);
    color:var(--seal);
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:14px;
    line-height:1.3;
    text-align:center;
    opacity:0.9;
  }
  @media (max-width:720px){ .stamp{ display:none; } }

  .controls{
    position:sticky; top:0; z-index:30;
    background:rgba(242,237,225,0.95);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:16px 6vw;
  }
  .search-row{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px;
  }
  .search-box{ flex:1 1 220px; position:relative; }
  .search-box input{
    width:100%;
    padding:12px 16px 12px 40px;
    border:2px solid var(--ink);
    border-radius:999px;
    background:var(--white);
    font-family:'Noto Sans TC',sans-serif;
    font-size:14.5px;
    outline:none;
    transition:box-shadow .2s ease;
  }
  .search-box input:focus{ box-shadow:0 0 0 3px rgba(167,51,42,0.18); }
  .search-box svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.55; }

  .area-toggle{ display:flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; flex:0 0 auto; }
  .area-toggle button{
    padding:11px 18px; border:none; background:var(--white);
    font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:13.5px;
    cursor:pointer; color:var(--ink); transition:background .2s, color .2s;
  }
  .area-toggle button + button{ border-left:2px solid var(--ink); }
  .area-toggle button.active{ background:var(--ink); color:var(--paper); }

  .hours-toggle{
    display:flex; align-items:center; gap:8px;
    padding:10px 16px;
    border:2px solid var(--jade);
    border-radius:999px;
    background:var(--white);
    cursor:pointer;
    font-size:13.5px;
    font-weight:700;
    color:var(--jade);
    flex:0 0 auto;
    user-select:none;
  }
  .hours-toggle.active{ background:var(--jade); color:var(--white); }
  .hours-toggle .indicator{ width:8px; height:8px; border-radius:50%; background:#8a8474; }
  .hours-toggle.active .indicator{ background:#8ee0a8; box-shadow:0 0 6px #8ee0a8; }

  .time-select-row{
    display:none;
    gap:10px; align-items:center; flex-wrap:wrap;
    margin-bottom:12px;
    font-size:13px; color:#5a5548;
  }
  .time-select-row.visible{ display:flex; }
  .time-select-row select{
    padding:8px 10px; border:1.5px solid var(--line); border-radius:8px;
    background:var(--white); font-family:'Noto Sans TC',sans-serif; font-size:13px;
  }

  .cat-select-wrap{
    position:relative; flex:0 0 auto;
    display:flex; align-items:center;
  }
  .cat-select-wrap::after{
    content:"";
    position:absolute; right:16px; top:50%; width:8px; height:8px;
    border-right:2px solid var(--ink); border-bottom:2px solid var(--ink);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .cat-select{
    appearance:none; -webkit-appearance:none;
    padding:11px 38px 11px 18px;
    border:2px solid var(--ink); border-radius:999px;
    background:var(--white); color:var(--ink);
    font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:13.5px;
    cursor:pointer; max-width:46vw;
  }
  .cat-select:focus{ outline:none; box-shadow:0 0 0 3px rgba(184,134,59,0.25); }

  .result-count{ margin-top:10px; font-size:12.5px; color:#7a7568; font-style:italic; }

  main{ padding:40px 6vw 100px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:26px; }
  .card{
    background:var(--white); border:1.5px solid var(--ink); border-radius:4px;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .card:hover{ transform:translateY(-5px); box-shadow:8px 10px 0 rgba(27,26,23,0.9); }

  .card-photo{
    position:relative; width:100%; height:150px; overflow:hidden;
    border-bottom:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .card-photo svg{ width:100%; height:100%; }
  .card-photo img{ width:100%; height:100%; object-fit:cover; }
  .card-photo-fallback{ width:100%; height:100%; }
  .card-photo-fallback svg{ width:100%; height:100%; display:block; }
  .card-photo .cat-label{
    position:absolute; bottom:8px; left:12px;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:13px;
    color:rgba(255,255,255,0.92); text-shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  .card-open-badge{
    position:absolute; top:10px; left:10px;
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
    display:flex; align-items:center; gap:5px;
  }
  .card-open-badge.open{ background:#e4f4e8; color:#2c6b41; }
  .card-open-badge.closed{ background:#f6e3e1; color:#a7332a; }
  .card-open-badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .card-top{ padding:16px 18px 12px; border-bottom:1px dashed var(--line); position:relative; }
  .card-cat{
    position:absolute; top:14px; right:16px; font-size:10.5px; font-weight:700; letter-spacing:.5px;
    padding:4px 10px; border-radius:999px; background:var(--paper2); color:var(--ink);
  }
  .card-name{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:19px; line-height:1.35;
    padding-right:60px; margin-bottom:6px;
  }
  .card-area{
    display:inline-block; font-size:11.5px; font-weight:700; color:var(--jade);
    border:1px solid var(--jade); border-radius:999px; padding:2px 9px; margin-bottom:8px;
  }
  .card-rating{ display:flex; align-items:center; gap:6px; font-size:13px; color:#59544a; }
  .card-rating .stars{ color:var(--gold); font-weight:700; }

  .card-body{ padding:14px 18px 16px; flex:1; display:flex; flex-direction:column; gap:10px; }
  .card-hours{ font-size:12.5px; color:#4c473d; display:flex; align-items:baseline; gap:6px; }
  .card-hours b{ color:var(--ink); font-weight:700; }
  .card-parking{
    font-size:12px; line-height:1.4;
    display:flex; gap:7px; align-items:center;
    border-radius:6px; padding:8px 10px;
    font-weight:700;
  }
  .card-parking .icon{ flex:0 0 auto; }
  .card-parking .sub{ font-weight:500; opacity:.8; margin-left:2px; }
  .card-parking.lot{ background:#e4f4e8; color:#2c6b41; }
  .card-parking.street{ background:#fbf1dc; color:#8a6a1f; }
  .card-parking.none{ background:#f6e3e1; color:#a7332a; }
  .card-parking.unknown{ background:var(--paper); color:#8a8474; border:1px dashed var(--line); font-weight:500; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
  .card-tags span{
    font-size:10.5px; padding:3px 8px; border-radius:4px;
    background:var(--paper); border:1px solid var(--line); color:#6b6656;
  }
  .card-foot{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 18px; border-top:1.5px solid var(--ink); background:var(--paper2); font-size:12px;
  }
  .card-foot .price{ font-weight:700; color:var(--seal); letter-spacing:1px; }
  .card-foot .links{ display:flex; gap:12px; }
  .card-foot a{
    color:var(--ink); text-decoration:none; font-weight:700;
    display:flex; align-items:center; gap:4px; border-bottom:1.5px solid var(--ink);
  }

  .empty-state{ text-align:center; padding:80px 20px; color:#8a8474; }
  .empty-state .kanji{
    font-family:'Zhi Mang Xing', cursive; font-size:56px; color:var(--seal); margin-bottom:10px; display:block;
  }

  footer{
    padding:32px 6vw 46px; border-top:3px solid var(--ink);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
    font-size:12px; color:#7a7568;
  }
  footer a{ color:#7a7568; }

  @media (max-width:520px){
    header{ padding:44px 5vw 32px; }
    .controls, main, footer{ padding-left:5vw; padding-right:5vw; }
    .card-name{ font-size:18px; }
  }
</style>
</head>

<header>

</div>

<main>

</footer>

function fmtHM(min){
  const h = Math.floor((min%1440)/60);
  const m = min%60;
  const ampm = h<12 ? "上午" : "下午";
  let h12 = h%12; if(h12===0) h12=12;
  return `${ampm}${h12}:${String(m).padStart(2,'0')}`;
}

function hoursSummary(name){
  const week = HOURS[name];
  if(!week) return "營業時間請洽店家";
  const today = (new Date().getDay()+6)%7;
  const ranges = week[today];
  if(!ranges || ranges.length===0) return `${DAY_NAMES[today]}公休`;
  return `${DAY_NAMES[today]} ` + ranges.map(r=>`${fmtHM(r[0])}–${fmtHM(r[1])}`).join('、');
}

function isOpenAt(name, dayIdx, minutes){
  const week = HOURS[name];
  if(!week) return null;
  const check = (d, absMin) => {
    const ranges = week[((d%7)+7)%7];
    return ranges.some(r => absMin >= (d*1440+r[0]) && absMin < (d*1440+r[1]));
  };
  const abs = dayIdx*1440 + minutes;
  if(check(dayIdx, abs)) return true;
  if(check(dayIdx-1, abs)) return true;
  if(check(dayIdx+7, abs+10080)) return true;
  return false;
}

const grid = document.getElementById('grid');
const catSelect = document.getElementById('catSelect');
const priceSelect = document.getElementById('priceSelect');
const areaToggle = document.getElementById('areaToggle');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');
const emptyState = document.getElementById('emptyState');
const hoursToggle = document.getElementById('hoursToggle');
const hoursToggleLabel = document.getElementById('hoursToggleLabel');
const timeSelectRow = document.getElementById('timeSelectRow');
const daySelect = document.getElementById('daySelect');
const timeSelect = document.getElementById('timeSelect');
const clearTimeBtn = document.getElementById('clearTimeBtn');

let state = { area:'all', cat:'all', price:'all', q:'', onlyOpen:false, customDay:null, customTime:null };

priceSelect.addEventListener('change', ()=>{
  state.price = priceSelect.value;
  render();
});

const categories = ['全部分類', ...Array.from(new Set(restaurants.map(r=>r.cat)))];

function buildCatSelect(){
  catSelect.innerHTML = '';
  categories.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c==='全部分類' ? 'all' : c;
    opt.textContent = c;
    catSelect.appendChild(opt);
  });
  catSelect.addEventListener('change', ()=>{
    state.cat = catSelect.value;
    render();
  });
}

function buildTimeSelectors(){
  DAY_NAMES.forEach((d,i)=>{
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = d;
    daySelect.appendChild(opt);
  });
  for(let h=0; h<24; h++){
    for(let m=0; m<60; m+=30){
      const opt = document.createElement('option');
      const val = h*60+m;
      opt.value = val;
      opt.textContent = fmtHM(val);
      timeSelect.appendChild(opt);
    }
  }
  const now = new Date();
  daySelect.value = (now.getDay()+6)%7;
  const nowMin = now.getHours()*60+now.getMinutes();
  timeSelect.value = Math.round(nowMin/30)*30 % 1440;
}

areaToggle.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.area = btn.dataset.area;
    areaToggle.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

hoursToggle.addEventListener('click', ()=>{
  state.onlyOpen = !state.onlyOpen;
  hoursToggle.classList.toggle('active', state.onlyOpen);
  timeSelectRow.classList.toggle('visible', state.onlyOpen);
  updateHoursLabel();
  render();
});

daySelect.addEventListener('change', ()=>{ state.customDay = parseInt(daySelect.value); render(); updateHoursLabel(); });
timeSelect.addEventListener('change', ()=>{ state.customTime = parseInt(timeSelect.value); render(); updateHoursLabel(); });
clearTimeBtn.addEventListener('click', ()=>{
  state.customDay = null; state.customTime = null;
  const now = new Date();
  daySelect.value = (now.getDay()+6)%7;
  timeSelect.value = Math.round((now.getHours()*60+now.getMinutes())/30)*30 % 1440;
  updateHoursLabel();
  render();
});

function updateHoursLabel(){
  if(!state.onlyOpen){ hoursToggleLabel.textContent = "只看現在營業中"; return; }
  if(state.customDay===null && state.customTime===null){
    hoursToggleLabel.textContent = "只看現在營業中";
  } else {
    hoursToggleLabel.textContent = `只看營業中（${DAY_NAMES[state.customDay]} ${fmtHM(state.customTime)}）`;
  }
}

searchInput.addEventListener('input', e=>{
  state.q = e.target.value.trim().toLowerCase();
  render();
});

function currentCheckPoint(){
  if(state.customDay!==null && state.customTime!==null){
    return {day: state.customDay, minutes: state.customTime};
  }
  const now = new Date();
  return {day:(now.getDay()+6)%7, minutes: now.getHours()*60+now.getMinutes()};
}

function parkingBadge(r){
  const sub = r.parkingSub || '';
  switch(r.parkingTier){
    case 'lot': return { cls:'lot', label:`${sub}停車場` };
    case 'street': return { cls:'street', label:`${sub}路邊停車` };
    case 'none': return { cls:'none', label:'無停車位，建議搭車前往' };
    default: return { cls:'unknown', label:'停車資訊未提供' };
  }
}

function render(){
  const cp = currentCheckPoint();
  const filtered = restaurants.filter(r=>{
    const areaOk = state.area==='all' || r.area===state.area;
    const catOk = state.cat==='all' || r.cat===state.cat;
    const priceOk = state.price==='all' || r.price===state.price;
    const qOk = !state.q || (r.name+r.cat+r.desc+r.tags.join(' ')).toLowerCase().includes(state.q);
    const openOk = !state.onlyOpen || isOpenAt(r.name, cp.day, cp.minutes)===true;
    return areaOk && catOk && priceOk && qOk && openOk;
  });

  resultCount.textContent = `共找到 ${filtered.length} 間餐廳`;
  grid.innerHTML = '';

  if(filtered.length===0){
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  filtered.forEach(r=>{
    const openNow = isOpenAt(r.name, cp.day, cp.minutes);
    const badgeClass = openNow ? 'open' : 'closed';
    const badgeText = openNow ? '營業中' : '目前休息';
    const pk = parkingBadge(r);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photo">
        <img src="${r.photo}" alt="${r.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-photo-fallback',innerHTML:catVisualSvg('${r.cat}')}))">
        <span class="card-open-badge ${badgeClass}"><span class="dot"></span>${badgeText}</span>
        <span class="cat-label">${r.cat}</span>
      </div>
      <div class="card-top">
        <div class="card-cat">${r.cat}</div>
        <div class="card-name">${r.name}</div>
        <div class="card-area">${r.area}</div>
        <div class="card-rating"><span class="stars">★ ${r.rating.toFixed(1)}</span></div>
      </div>
      <div class="card-body">
        <div class="card-hours"><b>營業：</b>${hoursSummary(r.name)}</div>
        <div class="card-desc" style="font-size:13px;line-height:1.7;color:#4c473d;">${r.desc}</div>
        <div class="card-parking ${pk.cls}"><span class="icon">🅿️</span><span>${pk.label}</span></div>
        <div class="card-tags">${r.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
      <div class="card-foot">
        <span class="price">${r.price}</span>
        <div class="links">
          <a href="tel:${r.phone.replace(/-/g,'')}">📞 致電</a>
          <a href="${r.mapsUrl}" target="_blank" rel="noopener">📍 Google 地圖</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

buildCatSelect();
buildTimeSelectors();
render();
</script>

</body>
</html>
